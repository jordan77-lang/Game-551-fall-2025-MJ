# Copy this file to %USERPROFILE%\.ngrok2\ngrok.yml (or run ngrok with --config <path>)
# Replace YOUR_TOKEN_HERE with the auth token from https://dashboard.ngrok.com/
version: "3"
authtoken: YOUR_TOKEN_HERE
tunnels:
  live:
    addr: 5501
    proto: http
  api:
    addr: 4000
    proto: http
  relay:
    addr: 4444
    proto: http
