<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Room Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 18px;
            z-index: 200;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Room Model...</div>
    
    <div id="info" class="hidden">
        <h3>VR Room Demo</h3>
        <p>🏠 Custom Blender Room Loaded</p>
        <p id="status">Status: Ready!</p>
        <p style="font-size: 12px; color: #888;">
            WASD - Move<br>
            Mouse - Look around<br>
            Click "Enter VR" for Quest
        </p>
        <p><a href="multiplayer.html" style="color: #4ade80;">← Back to Multiplayer</a></p>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let roomModel = null;

        // Movement
        let moveSpeed = 0.1;
        let keys = {};

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Add VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // OrbitControls for desktop
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.6, 0);
            controls.update();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Point lights for ambiance
            const pointLight1 = new THREE.PointLight(0xffa500, 0.5, 10);
            pointLight1.position.set(-3, 2, -3);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x4169e1, 0.5, 10);
            pointLight2.position.set(3, 2, -3);
            scene.add(pointLight2);

            // Load room model
            loadRoomModel();

            // Keyboard controls
            setupKeyboardControls();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Start animation
            renderer.setAnimationLoop(animate);
        }

        function loadRoomModel() {
            const loader = new GLTFLoader();
            
            // Try to load the CAMP model first; falls back if missing
            loader.load(
                'models/camp/camp.gltf',
                function (gltf) {
                    // Success - model loaded
                    roomModel = gltf.scene;
                    
                    // Enable shadows
                    roomModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    scene.add(roomModel);
                    console.log('Room model loaded successfully!');
                    
                    // Hide loading, show info
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('info').classList.remove('hidden');
                },
                function (xhr) {
                    // Loading progress
                    const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                    document.getElementById('loading').textContent = `Loading Room Model... ${percent}%`;
                },
                function (error) {
                    // Error - CAMP model not found, try legacy room.glb, then fallback
                    console.warn('Camp model not found, attempting models/room.glb ...');
                    loader.load(
                        'models/room.glb',
                        function (gltf) {
                            roomModel = gltf.scene;
                            roomModel.traverse((child) => {
                                if (child.isMesh) {
                                    child.castShadow = true;
                                    child.receiveShadow = true;
                                }
                            });
                            scene.add(roomModel);
                            document.getElementById('loading').classList.add('hidden');
                            document.getElementById('info').classList.remove('hidden');
                            document.getElementById('status').textContent = 'Status: Loaded legacy room.glb';
                        },
                        undefined,
                        function () {
                            console.log('No room.glb found either, creating fallback room');
                            createFallbackRoom();
                            document.getElementById('loading').classList.add('hidden');
                            document.getElementById('info').classList.remove('hidden');
                            document.getElementById('status').textContent = 'Status: Using fallback room (add models/camp/camp.gltf or models/room.glb)';
                        }
                    );
                }
            );
        }

        function createFallbackRoom() {
            // Create a simple room if no model is loaded
            const roomGroup = new THREE.Group();

            // Floor
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x808080,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            roomGroup.add(floor);

            // Walls
            const wallHeight = 3;
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xd3d3d3,
                roughness: 0.9
            });

            // Back wall
            const backWall = new THREE.Mesh(
                new THREE.PlaneGeometry(10, wallHeight),
                wallMaterial
            );
            backWall.position.set(0, wallHeight/2, -5);
            backWall.receiveShadow = true;
            roomGroup.add(backWall);

            // Left wall
            const leftWall = new THREE.Mesh(
                new THREE.PlaneGeometry(10, wallHeight),
                wallMaterial
            );
            leftWall.position.set(-5, wallHeight/2, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            roomGroup.add(leftWall);

            // Right wall
            const rightWall = new THREE.Mesh(
                new THREE.PlaneGeometry(10, wallHeight),
                wallMaterial
            );
            rightWall.position.set(5, wallHeight/2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            roomGroup.add(rightWall);

            // Add some furniture
            const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const table = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.1, 1),
                tableMaterial
            );
            table.position.set(0, 0.75, -2);
            table.castShadow = true;
            roomGroup.add(table);

            // Table legs
            for (let x of [-0.9, 0.9]) {
                for (let z of [-0.4, 0.4]) {
                    const leg = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.05, 0.05, 0.7),
                        tableMaterial
                    );
                    leg.position.set(x, 0.35, -2 + z);
                    leg.castShadow = true;
                    roomGroup.add(leg);
                }
            }

            scene.add(roomGroup);
            roomModel = roomGroup;
        }

        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
        }

        function updateMovement() {
            // WASD movement (disable when in VR)
            if (!renderer.xr.isPresenting) {
                if (keys['w']) camera.position.z -= moveSpeed;
                if (keys['s']) camera.position.z += moveSpeed;
                if (keys['a']) camera.position.x -= moveSpeed;
                if (keys['d']) camera.position.x += moveSpeed;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            updateMovement();
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        init();
    </script>
</body>
</html>
