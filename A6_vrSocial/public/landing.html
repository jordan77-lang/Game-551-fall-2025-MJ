<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Social - Landing</title>
  <style>
    body { margin:0; overflow:hidden; font-family: Arial, sans-serif; }
    #ui { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.75); color:#fff; padding: 14px; border-radius: 10px; width: 320px; z-index: 2; }
    #ui h2 { margin: 0 0 8px 0; font-size: 18px; }
    #ui label { font-size: 13px; color: #cbd5e1 }
    #ui input[type="color"], #ui select { width: 100%; margin: 6px 0 12px 0; padding: 6px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
    #rooms { max-height: 180px; overflow: auto; margin-top: 8px; border: 1px solid #334155; border-radius: 8px; padding: 8px; background: #0b1323; }
    .room { display:flex; justify-content: space-between; align-items:center; background:#111827; padding:8px; border-radius:6px; margin-bottom:6px }
    .room button { background: linear-gradient(90deg,#2563eb,#1d4ed8); color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer }
    #enterButtons { display:flex; gap:8px; }
    #enterButtons a, #enterButtons button { flex:1; text-align:center; padding:10px 12px; background: linear-gradient(90deg,#10b981,#059669); color:#fff; border:none; border-radius:8px; cursor:pointer; text-decoration:none }
    #mirrorNote { font-size: 12px; color: #9ca3af }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Welcome</h2>
    <div>
      <label>Display Name</label>
      <input id="displayName" placeholder="Your name" style="width:100%; padding:6px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#e2e8f0" />
      <!-- Ready Player Me is the only avatar option now -->
      <div style="display:flex; gap:8px; margin:8px 0 12px 0;">
        <button id="rpmButton" style="flex:1; background: linear-gradient(90deg,#ec4899,#f43f5e); color:#fff; border:none; padding:8px 10px; border-radius:8px; cursor:pointer">Create Avatar (Ready Player Me)</button>
        <button id="rpmClear" title="Clear RPM avatar" style="background:#334155; color:#e2e8f0; border:none; padding:8px 10px; border-radius:8px; cursor:pointer">Clear</button>
      </div>
      <div style="display:flex; gap:8px; margin:6px 0 12px 0; align-items:center;">
        <input id="relayUrl" placeholder="ws://localhost:4000" style="flex:1; padding:6px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#e2e8f0" />
        <button id="relayConnect" style="background:#2563eb; color:#fff; border:none; padding:8px 10px; border-radius:8px; cursor:pointer">Connect</button>
        <button id="relayDisconnect" style="background:#334155; color:#e2e8f0; border:none; padding:8px 10px; border-radius:8px; cursor:pointer">Disconnect</button>
        <button id="openJointMap" style="background:#0ea5e9; color:#022; border:none; padding:8px 10px; border-radius:8px; cursor:pointer">Map Joints</button>
      </div>
      <div style="margin-bottom:8px; color:#9ca3af; font-size:13px">
        Relay status: <span id="relayStatus">disconnected</span><br>
        <div id="debug" style="font-size:12px; color:yellow;"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <label style="color:#cbd5e1; font-size:13px">Enable IK</label>
        <input type="checkbox" id="ikEnable" />
        <label style="color:#cbd5e1; font-size:13px">Weight</label>
        <input id="ikWeight" type="range" min="0" max="1" step="0.05" value="1.0" style="width:120px" />
      </div>
      <p id="mirrorNote">You're in the Cube Room lobby. Create your avatar and see it in the mirror. Then pick another room below to join others.</p>
    </div>
    <div>
      <h2>Available Rooms</h2>
      <div id="rooms">Loading rooms…</div>
    </div>
  </div>

    // Navigation helpers
    const goTo = (room, scene) => {
      saveState();
      const params = new URLSearchParams({ room, name: state.name });
      if (state.avatarUrl) params.set('avatarUrl', state.avatarUrl);
      if (scene) params.set('scene', scene);
      window.location.href = `multiplayer.html?${params.toString()}`;
    };

    // Fetch rooms
    async function loadRooms() {
      try {
        const res = await fetch('/api/rooms');
        const rooms = await res.json();
        roomsCache = rooms;
        const container = document.getElementById('rooms');
        container.innerHTML = '';
        rooms.forEach(r => {
          // Filter out cube-room since that's the lobby we're already in
          if (r.id === 'cube-room') return;
          const div = document.createElement('div');
          div.className = 'room';
          const name = document.createElement('div');
          name.textContent = r.name;
          const btn = document.createElement('button');
          btn.textContent = 'Join';
          btn.onclick = () => goTo(r.id, r.scene);
          div.appendChild(name);
          div.appendChild(btn);
          container.appendChild(div);
        });
        if (watchPanel) updateWatchMenuRooms(roomsCache);
      } catch (e) {
        document.getElementById('rooms').textContent = 'No rooms found';
      }
    }
    loadRooms();

    // Ready Player Me integration (iframe modal)
    const rpmButton = document.getElementById('rpmButton');
    const rpmClear = document.getElementById('rpmClear');

    // Create overlay elements
    const overlay = document.createElement('div');
    overlay.id = 'rpmOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:none;';
    const frame = document.createElement('iframe');
    frame.id = 'rpmFrame';
    frame.allow = 'camera *; microphone *; clipboard-write';
    frame.style.cssText = 'width:100%;height:100%;border:0;';
    overlay.appendChild(frame);
    document.body.appendChild(overlay);

    const rpmSubdomain = 'demo'; // replace with your subdomain if you have one
    function openRpm() {
      // Load creator per RPM quickstart
      frame.src = `https://${rpmSubdomain}.readyplayer.me/avatar?frameApi`;
      overlay.style.display = 'block';
      frame.hidden = false;
    }
    function closeRpm() { overlay.style.display = 'none'; frame.src = ''; }

    rpmButton.onclick = (e) => { e.preventDefault(); openRpm(); };
    rpmClear.onclick = (e) => {
      e.preventDefault();
      state.avatarUrl = '';
      localStorage.removeItem('vr_rpm_avatar');
      rpmRoot.clear();
    };

    function parseRpmEvent(event) {
      try { return JSON.parse(event.data); } catch { return null; }
    }
    function isRpmOrigin(event) {
      try { return new URL(event.origin).hostname.endsWith('readyplayer.me'); } catch { return false; }
    }
    function subscribe(event) {
      if (!isRpmOrigin(event)) return;
      const json = parseRpmEvent(event);
      if (json?.source !== 'readyplayerme') return;

      if (json.eventName === 'v1.frame.ready') {
        frame.contentWindow.postMessage(
          JSON.stringify({ target: 'readyplayerme', type: 'subscribe', eventName: 'v1.**' }),
          '*'
        );
      }
      if (json.eventName === 'v1.avatar.exported') {
        const url = json.data?.url;
        if (url) {
          state.avatarUrl = url;
          localStorage.setItem('vr_rpm_avatar', url);
          loadRpmAvatar(url);
        }
        frame.hidden = true;
        closeRpm();
      }
      if (json.eventName === 'v1.user.set') {
        // Optional: handle user id if needed
        // console.log('RPM user set', json.data?.id);
      }
    }
    window.addEventListener('message', subscribe);
    document.addEventListener('message', subscribe);

    // Relay UI wiring (connect to a joint relay WebSocket)
    try {
      const relayInput = document.getElementById('relayUrl');
      const relayConnectBtn = document.getElementById('relayConnect');
      const relayDisconnectBtn = document.getElementById('relayDisconnect');
      // Choose a sensible default relay URL depending on whether the page is
      // served over HTTPS. If HTTPS, prefer a secure WSS relay on the same host
      // (so devices on the LAN will connect back to this machine). Otherwise
      // default to localhost ws for local dev.
      const stored = localStorage.getItem('vr_relay_url');
      let defaultRelay = 'ws://localhost:4000';
      try {
        if (window && window.location && window.location.protocol === 'https:') {
          const host = window.location.hostname || 'localhost';
          defaultRelay = `wss://${host}:4000`;
        }
      } catch(e) {}
      const savedRelay = stored || defaultRelay;
      if (relayInput) relayInput.value = savedRelay;
      if (relayConnectBtn) relayConnectBtn.onclick = () => {
        const url = (relayInput && relayInput.value) ? relayInput.value.trim() : savedRelay;
        try { localStorage.setItem('vr_relay_url', url); } catch(e){}
        startJointRelay(url);
        updateRelayStatus('connecting...');
      };
      if (relayDisconnectBtn) relayDisconnectBtn.onclick = () => { stopJointRelay(); updateRelayStatus('disconnected'); };
      // Auto-connect to saved relay by default (safe no-op if nothing listening)
      if (savedRelay) {
        // delay a bit to ensure three.js init functions exist
        setTimeout(() => { try { startJointRelay(savedRelay); } catch(e){} }, 1000);
      }
    } catch (e) { console.warn('Failed to wire relay UI', e); }
    // Wire joint mapping modal
    try {
      const openMapBtn = document.getElementById('openJointMap');
      if (openMapBtn) openMapBtn.onclick = () => { openJointMappingModal(); };
    } catch (e) { console.warn('Failed to wire joint mapping button', e); }

    // IK UI wiring moved below where IK state is declared to avoid temporal-deadzone errors

    // Three.js preview scene (Cube Room GLTF + mirror + RPM avatar)
    let scene, camera, renderer, controls, rpmRoot, mixer, clock = new THREE.Clock();
  let rpmBoneMap = {}; // map of detected bones for avatar retargeting
  let wristCorrection = {}; // extra correction from XR wrist orientation to avatar space
    let keys = {}; // For WASD movement
    let moveSpeed = 0.1;
  let controller1, controller2, controllerGrip1, controllerGrip2;
  let teleportMarker, tempMatrix = new THREE.Matrix4();
    
    // VR Controllers for grab and teleport
      let grabbed = null;
      let grabbedController = null;
    let teleportRay = null;
    
    // Physics world using Cannon.js
    let world, ballBody, ballMesh, groundBody;

  // Hands
  let hand1, hand2;
  let lastStableHands = { left: null, right: null };

    function refreshHandHandedness() {
      const session = (renderer.xr && typeof renderer.xr.getSession === 'function') ? renderer.xr.getSession() : null;
      const updateHand = (hand) => {
        if (!hand) return;
        let handedness = null;
        try { if (!handedness && hand.handedness) handedness = hand.handedness; } catch (e) {}
        try { if (!handedness && hand.inputSource && hand.inputSource.handedness) handedness = hand.inputSource.handedness; } catch (e) {}
        if (!handedness && session) {
          try {
            session.inputSources.forEach((src) => {
              if (handedness) return;
              try {
                if (src.hand && hand.joints && src.hand === hand.joints) handedness = src.handedness;
              } catch (err) {}
            });
          } catch (err) {}
        }
        if (handedness) {
          if (!hand.userData) hand.userData = {};
          hand.userData.handedness = handedness;
        }
      };
      updateHand(hand1);
      updateHand(hand2);
    }

    // Helper to pick left/right hands, preferring WebXR handedness to avoid midline flipping
    function pickHands() {
      const allHands = [hand1, hand2];
      const activeHands = allHands.filter(Boolean);

      // Drop cached assignments if their hand disappeared
      if (lastStableHands.left && !activeHands.includes(lastStableHands.left)) {
        lastStableHands.left = null;
      }
      if (lastStableHands.right && !activeHands.includes(lastStableHands.right)) {
        lastStableHands.right = null;
      }

      // First try explicit handedness from WebXR
      let left = null;
      let right = null;
      activeHands.forEach((h) => {
        const handedness = h && ((h.userData && h.userData.handedness) || h.handedness || (h.inputSource && h.inputSource.handedness));
        if (handedness === 'left' && !left) left = h;
        if (handedness === 'right' && !right) right = h;
      });

      // If both hands are visible and still unassigned, classify using camera-local X
      if (activeHands.length === 2 && (!left || !right)) {
        const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
        const camQuat = new THREE.Quaternion(); camera.getWorldQuaternion(camQuat);
        const camQuatInv = camQuat.clone().invert();

        const classified = activeHands.map((h) => {
          const wrist = getJointWorldPosition(h, 'wrist');
          if (!wrist) return null;
          const localX = wrist.clone().sub(camPos).applyQuaternion(camQuatInv).x;
          return { hand: h, localX };
        }).filter(Boolean).sort((a, b) => a.localX - b.localX);

        if (classified.length === 2) {
          if (!left) left = classified[0].hand;
          if (!right) right = classified[1].hand;
        }
      }

      if (!left && lastStableHands.left && activeHands.includes(lastStableHands.left)) left = lastStableHands.left;
      if (!right && lastStableHands.right && activeHands.includes(lastStableHands.right)) right = lastStableHands.right;

      if (!left) left = activeHands.find(h => h && h !== right) || activeHands[0] || null;
      if (!right) right = activeHands.find(h => h && h !== left) || activeHands[0] || null;

      lastStableHands.left = left;
      lastStableHands.right = right;

      return { left, right };
    }

    // Watch-menu state
  let watchPanel = null;
  let mirrorReflector = null;
    let watchButtons = [];
  let roomsCache = [];
  let leftSqueezeStart = 0;
    
    // VR teleportation offset
    let baseReferenceSpace = null;
    let vrOffset = new THREE.Vector3();
  // Hand-gesture teleport
  let leftHandTeleportRay = null;
  let prevRightPinch = false;
  let markerPrevVisible = false;
  // Debug / tuning parameters (exposed via in-VR panel)
  let rightPinchThreshold = 0.03; // meters
  let pinchThreshold = 0.04; // meters for general pinching
  let backFacingDotThreshold = -0.25; // dot threshold for back-of-hand detection (dot < threshold means back facing)
  let throwScalar = 14; // multiplier for conversion of hand velocity to ball throw
    
  // Hand tracking gesture state
  let isLeftPointing = false;
  let handTeleportMarker = null;    console.log('About to call initPreview()...');
    // Hand grab state (supports either hand)
    let handGrab = {

    };
    // Room bounds (fallback) - will try to compute from loaded GLTFs; otherwise use 2.5m radius

  let roomWalls = []; // CANNON bodies for static room walls

    // --- Joint relay (WebSocket) and retargeting tunables ---
    let relaySocket = null;
    let relayConnected = false;
  let relayShouldReconnect = false;
  let relayReconnectAttempts = 0;
  let relayReconnectTimer = null;
    const RELAY_URL_KEY = 'vr_relay_url';
    const JOINT_MAP_KEY = 'vr_joint_map';
    const RETARGET_WEIGHTS_KEY = 'vr_retarget_weights';

    // Retarget weights (persisted)
    let retargetWeights = {
      head: 0.7,
      neck: 0.6,
      leftWrist: 0.6,
      rightWrist: 0.6,
      hips: 0.5
    };

    try {
      const saved = localStorage.getItem(RETARGET_WEIGHTS_KEY);
      if (saved) Object.assign(retargetWeights, JSON.parse(saved));
    } catch (e) {}

    // Map of joint name -> bone name (user overrides); loaded from localStorage if present
    let jointNameMap = {};
    try { jointNameMap = JSON.parse(localStorage.getItem(JOINT_MAP_KEY) || '{}'); } catch (e) { jointNameMap = {}; }

    // track last seen joint names for mapping UI
    const lastSeenJoints = new Set();

    // last received joint positions (world space) keyed by joint name
  const lastJointPositions = {};
  const smoothedJointPositions = {};
  const smoothedJointRotations = {};
  const POSITION_SMOOTH_ALPHA = 0.2;
  const ROTATION_SMOOTH_ALPHA = 0.25;
  let lastHeadQuaternion = null;

    // IK settings (persisted)
    const IK_ENABLED_KEY = 'vr_ik_enabled';
    const IK_WEIGHT_KEY = 'vr_ik_weight';
    let ikEnabled = false;
    let ikWeight = parseFloat(localStorage.getItem(IK_WEIGHT_KEY) || '1.0');
    try { ikEnabled = localStorage.getItem(IK_ENABLED_KEY) === 'true'; } catch (e) { ikEnabled = false; }

    // Wire IK UI controls (do this after ikEnabled/ikWeight exist)
    try {
      const ikChk = document.getElementById('ikEnable');
      const ikSlider = document.getElementById('ikWeight');
      if (ikChk) { ikChk.checked = !!ikEnabled; ikChk.onchange = () => { ikEnabled = !!ikChk.checked; try { localStorage.setItem(IK_ENABLED_KEY, ikEnabled ? 'true' : 'false'); } catch(e){} }; }
      if (ikSlider) { ikSlider.value = (typeof ikWeight === 'number' ? ikWeight : 1.0); ikSlider.oninput = () => { ikWeight = parseFloat(ikSlider.value); try { localStorage.setItem(IK_WEIGHT_KEY, String(ikWeight)); } catch(e){} }; }
    } catch (e) { console.warn('Failed to wire IK UI', e); }

    function startJointRelay(url) {
      if (!url) return;
      // indicate we want an active connection
      relayShouldReconnect = true;
      relayReconnectAttempts = 0;
      stopJointRelay();
      try {
        relaySocket = new WebSocket(url);
        relaySocket.binaryType = 'arraybuffer';
        relaySocket.onopen = () => { relayConnected = true; console.log('Joint relay connected to', url); updateRelayStatus('connected'); };
        relaySocket.onclose = (ev) => {
          relayConnected = false;
          relaySocket = null;
          console.log('Joint relay disconnected', ev && ev.reason ? ev.reason : '');
          updateRelayStatus('disconnected');
          // attempt reconnect if desired
          if (relayShouldReconnect) {
            relayReconnectAttempts++;
            const delay = Math.min(10000, 500 * Math.pow(2, Math.min(relayReconnectAttempts, 6)));
            console.log('Attempting relay reconnect in', delay, 'ms (attempt', relayReconnectAttempts, ')');
            relayReconnectTimer = setTimeout(() => { try { startJointRelay(url); } catch(e){} }, delay);
            updateRelayStatus('reconnecting...');
          }
        };
        relaySocket.onerror = (e) => { console.warn('Joint relay socket error', e); };
        relaySocket.onmessage = (evt) => {
          try {
            const txt = typeof evt.data === 'string' ? evt.data : new TextDecoder().decode(evt.data);
            const obj = JSON.parse(txt);
            if (obj && obj.joints) handleJointFrame(obj);
          } catch (e) { console.warn('Failed to parse relay frame', e); }
        };
        updateRelayStatus('connecting...');
      } catch (e) { console.warn('Failed to start joint relay', e); }
    }

    function stopJointRelay() {
      try { 
        // prevent automatic reconnects when we intentionally stop
        relayShouldReconnect = false;
        if (relayReconnectTimer) { clearTimeout(relayReconnectTimer); relayReconnectTimer = null; }
        if (relaySocket) { relaySocket.close(); relaySocket = null; relayConnected = false; }
        updateRelayStatus('disconnected');
      } catch (e) {}
    }

  function updateRelayStatus(text) {
    try {
      const el = document.getElementById('relayStatus');
      if (el) el.textContent = text;
      // enable/disable connect button based on state
      const btnConnect = document.getElementById('relayConnect');
      const btnDisconnect = document.getElementById('relayDisconnect');
      if (btnConnect) btnConnect.disabled = (text === 'connecting...' || text === 'connected' || text === 'reconnecting...');
      if (btnDisconnect) btnDisconnect.disabled = (text !== 'connected' && text !== 'reconnecting...');
    } catch (e) {}
  }

  function updateDebug(text) {
    try {
      const el = document.getElementById('debug');
      if (el) el.textContent = text;
    } catch (e) {}
  }

    function handleJointFrame(frame) {
      if (!frame || !frame.joints || !rpmRoot) return;
      // record joint names for mapping UI
      try { frame.joints.forEach(j => lastSeenJoints.add(j.name || j.name && j.name.toString())); } catch (e) {}
      // Apply orientations for head/neck/wrists and optional hips position
      frame.joints.forEach(j => {
        const jn = (j.name || '').toLowerCase();
        const mapped = jointNameMap[j.name] || j.name;
        // parse quaternion and position
        let q = null, p = null;
        try {
          if (j.q && j.q.length === 4) q = new THREE.Quaternion(j.q[0], j.q[1], j.q[2], j.q[3]);
          if (j.p && j.p.length === 3) p = new THREE.Vector3(j.p[0], j.p[1], j.p[2]);
        } catch (e) {}

        // smooth and store last received positions for IK
        if (p && j.name) {
          try {
            const prev = smoothedJointPositions[j.name];
            const blended = prev ? prev.clone().lerp(p, POSITION_SMOOTH_ALPHA) : p.clone();
            smoothedJointPositions[j.name] = blended;
            lastJointPositions[j.name] = blended.clone();
          } catch (e) {}
        }

        // smooth rotations and keep last head orientation
        if (q && j.name) {
          try {
            const prevQ = smoothedJointRotations[j.name];
            const blendedQ = prevQ ? prevQ.clone().slerp(q, ROTATION_SMOOTH_ALPHA) : q.clone();
            smoothedJointRotations[j.name] = blendedQ;
            q = blendedQ.clone();
            if (jn.includes('head')) lastHeadQuaternion = blendedQ.clone();
          } catch (e) {}
        }

        // decide target bone
        const bone = mapJointToBone(j.name || jn);
        if (bone && q) {
            if (renderer && renderer.xr && renderer.xr.isPresenting && (jn.includes('wrist') || jn.includes('hand') || jn.includes('head') || jn.includes('neck'))) {
            return;
          }
          // choose weight
          let w = 0.6;
          if (jn.includes('head')) w = retargetWeights.head || w;
          else if (jn.includes('neck')) w = retargetWeights.neck || w;
          else if (jn.includes('wrist') || jn.includes('hand')) {
            if (jn.includes('left')) w = retargetWeights.leftWrist || w; else w = retargetWeights.rightWrist || w;
          }
          applyJointToBone(bone, q, w);
        }

        // optional hips/root position update (lightweight)
        // skip retargeting hips onto avatar root for now to avoid tug-of-war with VR rig
      });
    }

    function mapJointToBone(jointName) {
      if (!jointName || !rpmRoot) return null;
      // allow user override mapping first
      try {
        if (jointNameMap && jointNameMap[jointName]) {
          const byName = rpmRoot.getObjectByName(jointNameMap[jointName]);
          if (byName) return byName;
        }
      } catch (e) {}
      const n = jointName.toLowerCase();
      // quick matches for common joints
      const candidates = [];
      rpmRoot.traverse(obj => { if (obj.isBone || obj.isSkinnedMesh || obj.isObject3D) { if (obj.name) candidates.push(obj); } });
      // search for explicit wrist/hand/head/neck/hip substrings
      const substrings = ['left wrist','left_wrist','leftwrist','l_wrist','left hand','lefthand','left_hand','left','right wrist','right_wrist','rightwrist','r_wrist','right hand','righthand','right_hand','head','neck','hip','pelvis','spine','chest','upperarm','lowerarm','forearm','shoulder'];
      for (let s of substrings) {
        if (n.includes(s.replace(/ /g, '').replace('_',''))) continue; // skip poorly normalized
      }
      // Candidate selection: choose first bone whose name includes any of the likely tokens
      const tokens = [];
      if (n.includes('left')) tokens.push('left','l','_l');
      if (n.includes('right')) tokens.push('right','r','_r');
      ['wrist','hand','head','neck','hip','pelvis','spine','chest','upperarm','lowerarm','forearm','shoulder'].forEach(t => tokens.push(t));
      for (let c of candidates) {
        const cn = (c.name || '').toLowerCase();
        for (let t of tokens) {
          if (cn.includes(t)) return c;
        }
      }
      // fallback: try rpmBoneMap left/right wrist keys
      if (n.includes('left') && rpmBoneMap.leftWrist) return rpmBoneMap.leftWrist;
      if (n.includes('right') && rpmBoneMap.rightWrist) return rpmBoneMap.rightWrist;
      return null;
    }

    function applyJointToBone(bone, jointWorldQ, weight = 0.6) {
      if (!bone || !jointWorldQ) return;
      try {
        const parent = bone.parent || rpmRoot;
        const parentWorldQ = new THREE.Quaternion();
        parent.getWorldQuaternion(parentWorldQ);
        const desiredLocal = parentWorldQ.clone().invert().multiply(jointWorldQ);
        bone.quaternion.slerp(desiredLocal, weight);
      } catch (e) { /* ignore */ }
    }

    function setRoomBoundsFromObject(obj) {
      try {
        const box = new THREE.Box3().setFromObject(obj);
        if (!box.isEmpty()) {
          // Expand slightly for margin
          const pad = 0.05;
          roomBounds.min.copy(box.min).addScalar(-pad);
          roomBounds.max.copy(box.max).addScalar(pad);

          // Align physics ground to the lowest y in the room
          if (groundBody) {
            groundBody.position.set(0, box.min.y + 0.005, 0);
          }

          // If ball exists, clamp it inside the new bounds
          if (ballBody) {
            const p = ballBody.position;
            p.x = THREE.MathUtils.clamp(p.x, roomBounds.min.x + 0.1, roomBounds.max.x - 0.1);
            p.y = THREE.MathUtils.clamp(p.y, roomBounds.min.y + 0.1, roomBounds.max.y - 0.1);
            p.z = THREE.MathUtils.clamp(p.z, roomBounds.min.z + 0.1, roomBounds.max.z - 0.1);
            ballBody.position.copy(p);
            if (ballMesh) ballMesh.position.copy(p);
          }
          console.log('Room bounds set from object:', roomBounds);
          try {
            // If physics world already exists, create static walls
            if (world) createRoomPhysicsWalls();
          } catch (e) {}
        }
      } catch (e) { console.warn('Failed to compute room bounds:', e); }
    }

    // Create static physics walls based on roomBounds so objects collide naturally with walls
    function createRoomPhysicsWalls() {
      if (!world) return;
      // remove any existing walls
      try {
        roomWalls.forEach(w => { try { world.removeBody(w); } catch(e) {} });
      } catch (e) {}
      roomWalls = [];
      try {
        const thickness = 0.05; // wall thickness
        const min = roomBounds.min;
        const max = roomBounds.max;
        const width = max.x - min.x;
        const depth = max.z - min.z;
        const height = Math.max(1.5, max.y - min.y);
        const halfY = height / 2;

        // Left wall (near min.x)
        const leftHalf = new CANNON.Vec3(thickness/2, halfY, depth/2);
        const left = new CANNON.Body({ mass: 0 });
        left.addShape(new CANNON.Box(leftHalf));
        left.position.set(min.x + thickness/2, min.y + halfY, (min.z + max.z)/2);
        world.addBody(left); roomWalls.push(left);

        // Right wall (near max.x)
        const rightHalf = new CANNON.Vec3(thickness/2, halfY, depth/2);
        const right = new CANNON.Body({ mass: 0 });
        right.addShape(new CANNON.Box(rightHalf));
        right.position.set(max.x - thickness/2, min.y + halfY, (min.z + max.z)/2);
        world.addBody(right); roomWalls.push(right);

        // Front wall (near min.z)
        const frontHalf = new CANNON.Vec3(width/2, halfY, thickness/2);
        const front = new CANNON.Body({ mass: 0 });
        front.addShape(new CANNON.Box(frontHalf));
        front.position.set((min.x + max.x)/2, min.y + halfY, min.z + thickness/2);
        world.addBody(front); roomWalls.push(front);

        // Back wall (near max.z)
        const backHalf = new CANNON.Vec3(width/2, halfY, thickness/2);
        const back = new CANNON.Body({ mass: 0 });
        back.addShape(new CANNON.Box(backHalf));
        back.position.set((min.x + max.x)/2, min.y + halfY, max.z - thickness/2);
        world.addBody(back); roomWalls.push(back);

        console.log('Created', roomWalls.length, 'room walls for physics.');
      } catch (e) { console.warn('Failed to create room physics walls', e); }
    }

    function normalizeAngle(angle) {
      return Math.atan2(Math.sin(angle), Math.cos(angle));
    }

    function getAvatarYawFromDir(dir) {

    function recomputeAvatarHeadOffset() {

          _tmpHeadOffsetWorld.copy(_tmpRigWorldPos);

          avatarHeadOffset.copy(_tmpHeadOffsetWorld);
          avatarHeadOffset.z = THREE.MathUtils.clamp(avatarHeadOffset.z, HEAD_FORWARD_OFFSET_MIN, HEAD_FORWARD_OFFSET_MAX);
        } else {
          _tmpBox.setFromObject(rpmRoot);
          if (!_tmpBox.isEmpty()) {
            _tmpBox.getSize(_tmpHeadOffsetWorld);
            avatarHeadOffset.set(0, Math.max(1.4, _tmpHeadOffsetWorld.y * 0.85), DEFAULT_HEAD_FORWARD_OFFSET);
            avatarHeadOffset.z = THREE.MathUtils.clamp(avatarHeadOffset.z, HEAD_FORWARD_OFFSET_MIN, HEAD_FORWARD_OFFSET_MAX);

    function updateAvatarInVR(dt = 0.016, instant = false) {
      if (!(renderer.xr.isPresenting && rpmRoot && rpmRoot.parent)) return;

  const rigWorldPos = _tmpRigWorldPos;
  if (camera.parent) camera.parent.getWorldPosition(rigWorldPos); else camera.getWorldPosition(rigWorldPos);

  const mirrorFacingDirForOffset = _tmpFacingDir.set(0, 0, mirrorPlaneZ >= rigWorldPos.z ? 1 : -1);
  const mirrorYawForOffset = getAvatarYawFromDir(mirrorFacingDirForOffset);
  const yawForOffset = (instant || vrAnchorYaw === null) ? mirrorYawForOffset : vrAnchorYaw;
  _tmpQuatA.setFromAxisAngle(_yAxis, yawForOffset);
  _tmpHeadOffsetWorld.copy(avatarHeadOffset).applyQuaternion(_tmpQuatA);

      const desired = _tmpAvatarPos.copy(rigWorldPos).sub(_tmpHeadOffsetWorld);
      desired.y = 0;

      if (!vrAnchorPos) vrAnchorPos = desired.clone(); else vrAnchorPos.copy(desired);
      rpmRoot.position.copy(vrAnchorPos);

  const mirrorFacingDir = _tmpFacingDir.set(0, 0, mirrorPlaneZ - rpmRoot.position.z);
  if (Math.abs(mirrorFacingDir.z) < 1e-4) mirrorFacingDir.z = mirrorPlaneZ >= rpmRoot.position.z ? 1 : -1;
  const desiredYaw = getAvatarYawFromDir(mirrorFacingDir);
      if (instant || vrAnchorYaw === null) {
        vrAnchorYaw = desiredYaw;
      } else {
        const yawDelta = normalizeAngle(desiredYaw - vrAnchorYaw);
        const yawDeltaDeg = Math.abs(yawDelta * 180 / Math.PI);
        if (yawDeltaDeg > AVATAR_YAW_SNAP_DEG) {
          const blend = 1 - Math.exp(-AVATAR_YAW_SMOOTH * Math.max(dt, 1 / 120));
          vrAnchorYaw = normalizeAngle(vrAnchorYaw + yawDelta * blend);
        } else {
          vrAnchorYaw = desiredYaw;
        }
      }
      rpmRoot.rotation.set(0, vrAnchorYaw ?? desiredYaw, 0);
        // Simple retargeting: try to orient avatar wrist bones to match tracked hand wrists
        try {
          if (rpmBoneMap && (rpmBoneMap.leftWrist || rpmBoneMap.rightWrist)) {
            const hands = pickHands();
            if (rpmBoneMap.leftWrist && hands.left) {
              const jointQ = getJointWorldQuaternion(hands.left, 'wrist');
              if (jointQ) {
                if (!wristCorrection.left) {
                  const parent = rpmBoneMap.leftWrist.parent || rpmRoot;
                  const parentWorldQ = new THREE.Quaternion(); parent.getWorldQuaternion(parentWorldQ);
                  const bindLocal = (rpmBoneMap.leftWrist.userData && rpmBoneMap.leftWrist.userData.initialQuat) ? rpmBoneMap.leftWrist.userData.initialQuat.clone() : rpmBoneMap.leftWrist.quaternion.clone();
                  const bindWorld = parentWorldQ.clone().multiply(bindLocal);
                  wristCorrection.left = jointQ.clone().invert().multiply(bindWorld);
                }
                const correctedWorld = jointQ.clone().multiply(wristCorrection.left);
                const parent = rpmBoneMap.leftWrist.parent || rpmRoot;
                const parentWorldQ = new THREE.Quaternion(); parent.getWorldQuaternion(parentWorldQ);
                const localQ = parentWorldQ.clone().invert().multiply(correctedWorld);
                rpmBoneMap.leftWrist.quaternion.slerp(localQ, instant ? 1 : 0.75);
              }
            }
            if (rpmBoneMap.rightWrist && hands.right) {
              const jointQ = getJointWorldQuaternion(hands.right, 'wrist');
              if (jointQ) {
                if (!wristCorrection.right) {
                  const parent = rpmBoneMap.rightWrist.parent || rpmRoot;
                  const parentWorldQ = new THREE.Quaternion(); parent.getWorldQuaternion(parentWorldQ);
                  const bindLocal = (rpmBoneMap.rightWrist.userData && rpmBoneMap.rightWrist.userData.initialQuat) ? rpmBoneMap.rightWrist.userData.initialQuat.clone() : rpmBoneMap.rightWrist.quaternion.clone();
                  const bindWorld = parentWorldQ.clone().multiply(bindLocal);
                  wristCorrection.right = jointQ.clone().invert().multiply(bindWorld);
                }
                const correctedWorld = jointQ.clone().multiply(wristCorrection.right);
                const parent = rpmBoneMap.rightWrist.parent || rpmRoot;
                const parentWorldQ = new THREE.Quaternion(); parent.getWorldQuaternion(parentWorldQ);
                const localQ = parentWorldQ.clone().invert().multiply(correctedWorld);
                rpmBoneMap.rightWrist.quaternion.slerp(localQ, instant ? 1 : 0.75);
              }
            }
          }
        } catch (e) { /* ignore retarget errors */ }

        // Align head (and neck) toward the viewer's gaze
        try {
          if (rpmBoneMap && rpmBoneMap.head) {
            const camQuat = _tmpQuatA;
            camera.getWorldQuaternion(camQuat);
            rpmBoneMap.head.getWorldQuaternion(_tmpQuatB);

            if (!headCorrection.active) {
              headCorrection.quat.copy(camQuat).invert().multiply(_tmpQuatB);
              headCorrection.active = true;
            }

            const targetWorld = _tmpQuatC.copy(camQuat).multiply(headCorrection.quat);
            const headParentWorld = _tmpQuatD;
            (rpmBoneMap.head.parent || rpmRoot).getWorldQuaternion(headParentWorld);
            const headLocal = headParentWorld.clone().invert().multiply(targetWorld);
            rpmBoneMap.head.quaternion.slerp(headLocal, instant ? 1 : 0.55);

            if (rpmBoneMap.neck) {
              (rpmBoneMap.neck.parent || rpmRoot).getWorldQuaternion(_tmpQuatB);
              const neckLocal = _tmpQuatB.clone().invert().multiply(targetWorld);
              rpmBoneMap.neck.quaternion.slerp(neckLocal, instant ? 1 : 0.35);
            }
          }
        } catch (e) { /* ignore head retarget errors */ }
        // apply IK after orientation retarget
        try { if (ikEnabled) updateTwoBoneIK(); } catch(e) {}
    }

    // VR Controllers for grab and teleport
    function setupVRControllers() {
      const controllerModelFactory = new XRControllerModelFactory();

      controller1.addEventListener('squeezeend', () => {

    function setupHands() {
      const handFactory = new XRHandModelFactory();
    hand1 = renderer.xr.getHand(0);
    hand1.add(handFactory.createHandModel(hand1, 'mesh'));
    scene.add(hand1);

    hand2 = renderer.xr.getHand(1);

    scene.add(hand2);

      // Left-hand teleport ray (for pointing)
    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00 });

    leftHandTeleportRay.visible = false;
    // Add to scene and we'll position it per-frame on the chosen left hand
    scene.add(leftHandTeleportRay);
      refreshHandHandedness();
      renderer.xr.addEventListener('sessionstart', refreshHandHandedness);
      renderer.xr.addEventListener('inputsourceschange', refreshHandHandedness);

    function getJointWorldPosition(hand, jointName) {
      try {
        if (!hand) return null;
        const joint = hand.joints && (hand.joints[jointName] || hand.joints[jointName.replace('-', '')]);
        if (joint) {
          const p = new THREE.Vector3();
          joint.getWorldPosition(p);
          return p;
        }
      } catch (e) {}
      return null;
    }

    function getJointWorldQuaternion(hand, jointName) {
      try {
        if (!hand) return null;
        const joint = hand.joints && (hand.joints[jointName] || hand.joints[jointName.replace('-', '')]);
        if (joint) {
          const q = new THREE.Quaternion();
          joint.getWorldQuaternion(q);
          return q;
        }
      } catch (e) {}
      return null;
    }

    function isRightPinching(distanceThreshold = 0.03) {
      // Use pickHands to find the right-hand and test it
      const chosen = pickHands();
      const right = chosen.right;
      const thresh = rightPinchThreshold || distanceThreshold;
      if (!right) return false;
      const thumb = getJointWorldPosition(right, 'thumb-tip') || getJointWorldPosition(right, 'thumbtip');
      const index = getJointWorldPosition(right, 'index-finger-tip') || getJointWorldPosition(right, 'indexfingertip') || getJointWorldPosition(right, 'index-finger-phalanx-tip');
      if (!thumb || !index) return false;
      return thumb.distanceTo(index) < thresh;
    }

    function isPinching(hand, distanceThreshold = 0.04) {
      if (!hand) return false;
      const thresh = pinchThreshold || distanceThreshold;
      const thumb = getJointWorldPosition(hand, 'thumb-tip') || getJointWorldPosition(hand, 'thumbtip');
      const index = getJointWorldPosition(hand, 'index-finger-tip') || getJointWorldPosition(hand, 'indexfingertip') || getJointWorldPosition(hand, 'index-finger-phalanx-tip');
      if (!thumb || !index) return false;
      return thumb.distanceTo(index) < thresh;
    }

    function tryStartHandGrab(hand) {
      if (!hand || !ballMesh || !ballBody) return false;
      // Prefer index tip as grab joint
      const joint = getJointWorldPosition(hand, 'index-finger-tip') || getJointWorldPosition(hand, 'indexfingertip');
      if (!joint) return false;
      const ballPos = new THREE.Vector3();
      ballMesh.getWorldPosition(ballPos);
      if (joint.distanceTo(ballPos) < 0.22) {
        handGrab.hand = hand;
        handGrab.jointName = 'index-finger-tip';
        handGrab.prevPos = joint.clone();
        handGrab.vel.set(0,0,0);
        // zero physics while grabbed
        ballBody.velocity.set(0,0,0);
        ballBody.angularVelocity.set(0,0,0);
        grabbed = ballMesh; // reuse existing grabbed flag for controller logic
        return true;
      }
      return false;
    }

    function releaseHandGrab(hand) {
      if (!handGrab.hand || handGrab.hand !== hand) return;
      // apply velocity based on recent hand movement
      const throwVel = handGrab.vel.clone().multiplyScalar(throwScalar); // tuning factor
      if (ballBody) {
        try { if (typeof ballBody.wakeUp === 'function') ballBody.wakeUp(); } catch(e) {}
        ballBody.velocity.set(throwVel.x, throwVel.y, throwVel.z);
        // small angular impulse
        ballBody.angularVelocity.set((Math.random()-0.5)*3, (Math.random()-0.5)*3, (Math.random()-0.5)*3);
      }
      grabbed = null;
      handGrab.hand = null;
      handGrab.jointName = null;
      handGrab.prevPos = null;
      handGrab.vel.set(0,0,0);
    }

    function updateHandGrabTracking(dt = 1/60) {
      if (handGrab.hand && handGrab.jointName && ballBody && ballMesh) {
        const p = getJointWorldPosition(handGrab.hand, handGrab.jointName) || handGrab.prevPos;
        if (!p) return;
        // compute velocity
        const v = p.clone().sub(handGrab.prevPos || p).divideScalar(dt);
        // smooth velocity
        handGrab.vel.lerp(v, 0.6);
        handGrab.prevPos.copy(p);
        // move ball body to follow hand joint
        ballBody.position.set(p.x, p.y, p.z);
        ballMesh.position.copy(ballBody.position);
      }
    }

    function updateHandGestures() {
      // Determine left/right hands robustly
      const hands = pickHands();
      const leftHand = hands.left;
      const rightHand = hands.right;

      if (!TELEPORT_ENABLED) {
        if (teleportMarker) teleportMarker.visible = false;
        if (leftHandTeleportRay) leftHandTeleportRay.visible = false;
        return;
      }

      // Determine left-hand pointing origin and direction
      if (!leftHand && !rightHand) return;
      let origin = null;
      let dir = new THREE.Vector3(0,0,-1);
      if (leftHand) {
        const indexTip = getJointWorldPosition(leftHand, 'index-finger-tip') || getJointWorldPosition(leftHand, 'indexfingertip');
        const wrist = getJointWorldPosition(leftHand, 'wrist');
        if (indexTip && wrist) {
          origin = indexTip.clone();
          dir = indexTip.clone().sub(wrist).normalize();
        } else {
          origin = new THREE.Vector3();
          leftHand.getWorldPosition(origin);
          dir = new THREE.Vector3(0,0,-1).applyQuaternion(leftHand.quaternion);
        }
      } else if (rightHand) {
        // fallback: use right hand for pointing if left not present
        const indexTip = getJointWorldPosition(rightHand, 'index-finger-tip') || getJointWorldPosition(rightHand, 'indexfingertip');
        const wrist = getJointWorldPosition(rightHand, 'wrist');
        if (indexTip && wrist) {
          origin = indexTip.clone();
          dir = indexTip.clone().sub(wrist).normalize();
        } else {
          origin = new THREE.Vector3();
          rightHand.getWorldPosition(origin);
          dir = new THREE.Vector3(0,0,-1).applyQuaternion(rightHand.quaternion);
        }
      }

      // Raycast with left-hand pointing
      if (origin) {
        const raycaster = new THREE.Raycaster(origin, dir);
        const intersects = raycaster.intersectObjects(scene.children, true);
        if (intersects.length > 0) {
          const hit = intersects[0].point;
          const floorY = groundBody ? groundBody.position.y : 0.01;
          teleportMarker.position.set(hit.x, floorY + 0.01, hit.z);
          teleportMarker.visible = true;
          // show left-hand ray and position it
          if (leftHandTeleportRay) {
            leftHandTeleportRay.visible = true;
            // position ray at origin and orient toward dir
            leftHandTeleportRay.position.copy(origin);
            const q = new THREE.Quaternion();
            q.setFromUnitVectors(new THREE.Vector3(0,0,-1), dir.clone().normalize());
            leftHandTeleportRay.setRotationFromQuaternion(q);
          }
        } else {
          teleportMarker.visible = false;
          if (leftHandTeleportRay) leftHandTeleportRay.visible = false;
        }
      }

      // Detect right-hand pinch to activate teleport
      const pinching = isRightPinching();
      const markerJustBecameVisible = teleportMarker && teleportMarker.visible && !markerPrevVisible;
      if (pinching && (!prevRightPinch || markerJustBecameVisible)) {
        // pinch started or marker appeared while already pinching: trigger teleport if marker visible
        if (teleportMarker && teleportMarker.visible) {
          // reuse teleport logic from onSelectEnd
          if (renderer.xr.isPresenting) {
            const cameraPos = new THREE.Vector3();
            camera.getWorldPosition(cameraPos);
            vrOffset.x += teleportMarker.position.x - cameraPos.x;
            vrOffset.z += teleportMarker.position.z - cameraPos.z;
            if (camera.parent) camera.parent.position.copy(vrOffset);
            if (rpmRoot && rpmRoot.parent === scene) rpmRoot.position.set(vrOffset.x, 0, vrOffset.z);
          } else {
            camera.position.x = teleportMarker.position.x;
            camera.position.z = teleportMarker.position.z;
          }
          // hide marker after teleport
          teleportMarker.visible = false;
          if (leftHandTeleportRay) leftHandTeleportRay.visible = false;
        }
      }
      prevRightPinch = pinching;
      markerPrevVisible = teleportMarker && teleportMarker.visible;

      // Hand-based grabbing: detect pinches on either hand to grab/release the ball
      // Start grab if pinching and close to ball
      try {
        const chosen = pickHands();
        const left = chosen.left; const right = chosen.right;
        if (!handGrab.hand) {
          if (isPinching(left)) tryStartHandGrab(left);
          else if (isPinching(right)) tryStartHandGrab(right);
        } else {
          // If currently grabbing, release when pinch no longer detected
          if (!isPinching(handGrab.hand)) {
            releaseHandGrab(handGrab.hand);
          }
        }
      } catch (e) { console.warn('Hand grab error', e); }

      // Show watch menu when the back of the left hand faces the user (i.e., palm normal points away from user)
      try {
        const chosen = pickHands();
        const left = chosen.left;
        if (left && watchPanel) {
          // get wrist and palm normal approximation: use index-finger-knuckle and wrist
          const wrist = getJointWorldPosition(left, 'wrist');
          const indexTip = getJointWorldPosition(left, 'index-finger-tip') || getJointWorldPosition(left, 'indexfingertip');
          if (wrist && indexTip) {
            const palmDir = indexTip.clone().sub(wrist).normalize(); // approximate forward of hand
            // Vector from hand to camera
            const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
            const toCam = camPos.clone().sub(wrist).normalize();
            // if palmDir dot toCam < threshold means back of hand facing camera
            const dot = palmDir.dot(toCam);
            const backFacing = dot < backFacingDotThreshold;
            if (backFacing) {
              // show and orient watchPanel to face camera
              watchPanel.visible = true;
              // choose left controller grip to attach/orient panel near
              let leftGrip = controllerGrip1 || controllerGrip2 || null;
              try {
                const g1 = controllerGrip1 ? controllerGrip1.getWorldPosition(new THREE.Vector3()) : null;
                const g2 = controllerGrip2 ? controllerGrip2.getWorldPosition(new THREE.Vector3()) : null;
                const cam = new THREE.Vector3(); camera.getWorldPosition(cam);
                if (g1 && g2) {
                  leftGrip = (g1.x < g2.x) ? controllerGrip1 : controllerGrip2;
                } else if (g1) {
                  leftGrip = controllerGrip1;
                } else if (g2) {
                  leftGrip = controllerGrip2;
                }
              } catch (e) {}
              if (leftGrip) {
                const worldPos = new THREE.Vector3(); leftGrip.getWorldPosition(worldPos);
                const camPos = new THREE.Vector3(); camera.getWorldPosition(camPos);
                const look = camPos.clone().sub(worldPos).normalize();
                const yaw = Math.atan2(look.x, look.z);
                watchPanel.rotation.set(0, -yaw, 0);
                // keep panel attached to original parent (controllerGrip1) but positioned via its local offset
              }
            } else {
              if (!watchPanel.userData.forceVisible) watchPanel.visible = false;
            }
          }
        }
      } catch (e) { /* ignore */ }
    }

    function onSelectStart(event) {
      const controller = event.target;
      const isRight = controller === controller2;

      // If debug panel visible, check debug buttons first (right controller)
      if (debugPanel && debugPanel.visible && isRight && debugButtons.length) {
        const dHit = intersectDebugButtons(controller);
        if (dHit && dHit.userData && dHit.userData.debugName) {
          const name = dHit.userData.debugName;
          switch (name) {
            case 'RPinch+': rightPinchThreshold = Math.max(0.005, rightPinchThreshold - 0.005); break;
            case 'RPinch-': rightPinchThreshold = rightPinchThreshold + 0.005; break;
            case 'Pinch+': pinchThreshold = Math.max(0.005, pinchThreshold - 0.005); break;
            case 'Pinch-': pinchThreshold = pinchThreshold + 0.005; break;
            case 'Throw+': throwScalar = Math.max(0.1, throwScalar - 0.5); break;
            case 'Throw-': throwScalar = throwScalar + 0.5; break;
            case 'BackDot+': backFacingDotThreshold = Math.max(-1, backFacingDotThreshold - 0.05); break;
            case 'BackDot-': backFacingDotThreshold = Math.min(1, backFacingDotThreshold + 0.05); break;
          }
          refreshDebugPanelTexture();
          return;
        }
      }

      // If watch menu visible, allow selecting buttons with right controller
      if (watchPanel && watchPanel.visible && isRight && watchButtons.length) {
        const hit = intersectWatchButtons(controller);
        if (hit && hit.userData) {
          if (hit.userData.room) {
            const r = hit.userData.room;
            goTo(r.id, r.scene);
            return;
          }
          if (hit.userData.leave) {
            // End XR session if available
            try {
              const sess = renderer.xr.getSession && renderer.xr.getSession();
              if (sess) sess.end();
            } catch (e) { console.warn('Failed to end XR session', e); }
            return;
          }
          if (hit.userData.debug) {
            makeDebugPanel();
            if (debugPanel) {
              debugPanel.visible = !debugPanel.visible;
              if (debugPanel.visible) refreshDebugPanelTexture();
            }
            return;
          }
        }
      }

      // Try to grab ball (use world positions)
      if (ballMesh) {
        const ctrlPos = new THREE.Vector3();
        controller.getWorldPosition(ctrlPos);
        const ballPos = new THREE.Vector3();
        ballMesh.getWorldPosition(ballPos);
        const dist = ctrlPos.distanceTo(ballPos);
        if (dist < 0.25) {
          grabbed = ballMesh;
          grabbedController = controller;
          if (ballBody) {
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
          }
          return;
        }
      }
      // Otherwise show teleport ray
      if (teleportRay) teleportRay.visible = TELEPORT_ENABLED && renderer.xr.isPresenting;
    }

    function onSelectEnd(event) {
      if (grabbed) {
        // Throw ball
        const controller = event.target;
        const direction = new THREE.Vector3();
        controller.getWorldDirection(direction);
        try { if (typeof ballBody.wakeUp === 'function') ballBody.wakeUp(); } catch(e) {}
        if (ballBody) ballBody.velocity.copy(direction.multiplyScalar(7));
        grabbed = null;
        grabbedController = null;
      } else if (TELEPORT_ENABLED && teleportMarker && teleportMarker.visible) {
        // Teleport: In VR, we offset the base reference space
        if (renderer.xr.isPresenting) {
          // Get the camera's current offset from the origin
          const cameraPos = new THREE.Vector3();
          camera.getWorldPosition(cameraPos);
          
          // Calculate how much to offset to place user at target
          vrOffset.x += teleportMarker.position.x - cameraPos.x;
          vrOffset.z += teleportMarker.position.z - cameraPos.z;
          
          // Apply offset to camera parent (which moves the whole VR rig)
          camera.parent.position.copy(vrOffset);
          
          // Update avatar position if it exists
          if (rpmRoot && rpmRoot.parent === scene) {
            rpmRoot.position.set(vrOffset.x, 0, vrOffset.z);
          }
        } else {
          // Desktop mode: just move camera
          camera.position.x = teleportMarker.position.x;
          camera.position.z = teleportMarker.position.z;
        }
      }
      if (teleportRay) teleportRay.visible = false;
      if (teleportMarker) teleportMarker.visible = false;
    }

    function updateTeleport() {
      if (!renderer.xr.isPresenting || !controller1) {
        if (!TELEPORT_ENABLED) {
          if (teleportRay) teleportRay.visible = false;
          if (teleportMarker) teleportMarker.visible = false;
        }
        return;
      }
      try {
        if (grabbed && ballMesh && ballBody) {
          // Follow the controller that grabbed the ball (or controller1 fallback)
          const pos = new THREE.Vector3();
          const ctrl = grabbedController || controller1;
          if (ctrl) ctrl.getWorldPosition(pos);
          ballBody.position.copy(pos);
          ballMesh.position.copy(pos);
        }
        if (!TELEPORT_ENABLED) {
          if (teleportRay) teleportRay.visible = false;
          if (teleportMarker) teleportMarker.visible = false;
          return;
        }
        if (teleportRay && teleportRay.visible) {
          // Raycast to find teleport target
          const raycaster = new THREE.Raycaster();
          tempMatrix.identity().extractRotation(controller1.matrixWorld);
          raycaster.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
          raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
          const intersects = raycaster.intersectObjects(scene.children, true);
          if (intersects.length > 0) {
            const hit = intersects[0].point;
            const floorY = groundBody ? groundBody.position.y : 0.01;
            teleportMarker.position.set(hit.x, floorY + 0.01, hit.z);
            teleportMarker.visible = true;
          } else {
            teleportMarker.visible = false;
          }
        }
      } catch (e) {
        console.warn('Teleport update error:', e);
      }
    }

    // Physics world using Cannon.js (CDN)
    function setupSoccerBall(loader) {
      // Load Cannon.js from CDN (use the bundled version that exposes CANNON globally)
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js';
      script.onload = () => {
        // Initialize physics world
        world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.solver.iterations = 10;
        world.allowSleep = true;

  // If room bounds were computed already, create static walls now
  try { createRoomPhysicsWalls(); } catch (e) {}
        // Ground plane
        groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        // Ball body
        ballBody = new CANNON.Body({
          mass: 0.45, // Soccer ball ~450g
          shape: new CANNON.Sphere(0.11),
          linearDamping: 0.3,
          angularDamping: 0.3
        });
  ballBody.position.set(-1.2, 0.35, 2.1);
        world.addBody(ballBody);

        // Load ball mesh
        loader.load('Rooms/soccer_ball.glb', (g) => {
          ballMesh = g.scene;
          // Scale GLB so its visual diameter matches ~0.22m
          try {
            const box = new THREE.Box3().setFromObject(ballMesh);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const desired = 0.22;
            const s = desired / maxDim;
            ballMesh.scale.setScalar(s);
          } catch { ballMesh.scale.setScalar(0.22); }
          ballMesh.position.copy(ballBody.position);
          scene.add(ballMesh);
          console.log('Soccer ball loaded at', ballMesh.position);
        }, undefined, (e) => {
          console.warn('Failed to load soccer ball GLB, using fallback sphere', e);
          // Fallback to a simple sphere if GLTF fails
          const geometry = new THREE.SphereGeometry(0.11, 32, 32);
          const material = new THREE.MeshStandardMaterial({ color: 0xffffff, map: createSoccerTexture() });
          ballMesh = new THREE.Mesh(geometry, material);
          ballMesh.position.copy(ballBody.position);
          scene.add(ballMesh);
        });
      };
      document.head.appendChild(script);
    }

    function updatePhysics() {
      if (!world) return;
      try {
        world.step(1 / 60);
        // If hand is grabbing, override physics position before step results
        updateHandGrabTracking(1/60);

        // Enforce simple room bounds for the ball (respect the ball radius so it stops at wall face)
        if (ballBody) {
          const p = ballBody.position;
          let clamped = false;
          // determine radius (prefer physics shape radius)
          let radius = 0.11;
          try {
            if (ballBody.shapes && ballBody.shapes.length && typeof ballBody.shapes[0].radius === 'number') radius = ballBody.shapes[0].radius;
          } catch (e) {}
          // Also consider the visual mesh bounding box in case the GLB visual size differs from the physics shape
          try {
            if (ballMesh) {
              const vb = new THREE.Box3().setFromObject(ballMesh);
              const vs = new THREE.Vector3(); vb.getSize(vs);
              const visualRadius = Math.max(vs.x, vs.y, vs.z) * 0.5;
              if (visualRadius > radius) radius = visualRadius;
            }
          } catch (e) {}
          const eps = 0.02; // small margin to avoid visible clipping
          const minX = roomBounds.min.x + radius + eps;
          const maxX = roomBounds.max.x - radius - eps;
          const minY = roomBounds.min.y + radius + eps;
          const maxY = roomBounds.max.y - radius - eps;
          const minZ = roomBounds.min.z + radius + eps;
          const maxZ = roomBounds.max.z - radius - eps;
          if (p.x < minX) { p.x = minX; clamped = true; }
          if (p.x > maxX) { p.x = maxX; clamped = true; }
          if (p.y < minY) { p.y = minY; clamped = true; }
          if (p.y > maxY) { p.y = maxY; clamped = true; }
          if (p.z < minZ) { p.z = minZ; clamped = true; }
          if (p.z > maxZ) { p.z = maxZ; clamped = true; }
          if (clamped) {
            // damp velocity to avoid sticking
            try { ballBody.velocity.scale(0.4, ballBody.velocity); } catch (e) {}
          }
        }

        if (ballMesh && ballBody) {
          ballMesh.position.copy(ballBody.position);
          ballMesh.quaternion.copy(ballBody.quaternion);
        }
      } catch (e) {
        console.warn('Physics update error:', e);
      }
    }

    function createSoccerTexture() {
      // Simple black/white pattern for fallback ball
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(256, 256, 200, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    // --- Watch menu (left wrist) ---
    function setupWatchMenu() {
      if (!renderer) return;
      // Title panel (larger and taller to avoid overlap)
      const panelGeo = new THREE.PlaneGeometry(0.26, 0.24);
      const mat = new THREE.MeshBasicMaterial({ map: makeButtonTexture('Rooms'), transparent: true });
      watchPanel = new THREE.Mesh(panelGeo, mat);
      watchPanel.visible = false;
      // Place at left wrist area (attach to wrist grip) but we will orient it dynamically
      watchPanel.position.set(0.08, 0.02, 0);
      watchPanel.rotation.y = -Math.PI / 2;
      // pick left grip if available
      let leftGrip = controllerGrip1 || null;
      try {
        if (controllerGrip1 && controllerGrip2) {
          const p1 = controllerGrip1.getWorldPosition(new THREE.Vector3());
          const p2 = controllerGrip2.getWorldPosition(new THREE.Vector3());
          leftGrip = (p1.x < p2.x) ? controllerGrip1 : controllerGrip2;
        }
      } catch (e) { /* ignore */ }
      if (leftGrip) leftGrip.add(watchPanel);
      updateWatchMenuRooms(roomsCache);
    }

    function toggleWatchMenu() {
      if (!watchPanel) return;
      watchPanel.visible = !watchPanel.visible;
    }

    function updateWatchMenuRooms(rooms) {
      if (!watchPanel) return;
      // Remove previous button meshes
      watchButtons.forEach(b => watchPanel.remove(b));
      watchButtons = [];
      const entries = rooms.filter(r => r.id !== 'cube-room');
      const startY = 0.06; // start near top of panel
      const gap = 0.055; // increase gap to avoid stacking
      entries.forEach((r, i) => {
        const btnGeo = new THREE.PlaneGeometry(0.22, 0.05);
        const tex = makeButtonTexture(r.name);
        const btnMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        const btn = new THREE.Mesh(btnGeo, btnMat);
        btn.position.set(0, startY - i * gap, 0.001);
        btn.userData.room = r;
        watchPanel.add(btn);
        watchButtons.push(btn);
      });
      // Add Leave VR button at bottom
      const leaveGeo = new THREE.PlaneGeometry(0.22, 0.05);
      const leaveTex = makeButtonTexture('Leave VR');
      const leaveMat = new THREE.MeshBasicMaterial({ map: leaveTex, transparent: true });
      const leaveBtn = new THREE.Mesh(leaveGeo, leaveMat);
      leaveBtn.position.set(0, startY - entries.length * gap - 0.02, 0.001);
      leaveBtn.userData.leave = true;
      watchPanel.add(leaveBtn);
      watchButtons.push(leaveBtn);

      // Add Debug button to open in-VR tuning panel
      const debugGeo = new THREE.PlaneGeometry(0.22, 0.05);
      const debugTex = makeButtonTexture('Debug');
      const debugMat = new THREE.MeshBasicMaterial({ map: debugTex, transparent: true });
      const debugBtn = new THREE.Mesh(debugGeo, debugMat);
      debugBtn.position.set(0, startY - entries.length * gap - 0.08, 0.001);
      debugBtn.userData.debug = true;
      watchPanel.add(debugBtn);
      watchButtons.push(debugBtn);
    }

    // Debug panel (floating) and interactive buttons
    let debugPanel = null;
    let debugButtons = [];
    function makeDebugPanel() {
      // Panel geometry
      // choose left grip to attach to
      let leftGrip = controllerGrip1 || null;
      try {
        if (controllerGrip1 && controllerGrip2) {
          const p1 = controllerGrip1.getWorldPosition(new THREE.Vector3());
          const p2 = controllerGrip2.getWorldPosition(new THREE.Vector3());
          leftGrip = (p1.x < p2.x) ? controllerGrip1 : controllerGrip2;
        }
      } catch (e) {}
      if (!leftGrip) return;
      if (debugPanel) return debugPanel;
      const panelGeo = new THREE.PlaneGeometry(0.30, 0.28);
      const tex = makeDebugTexture();
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      debugPanel = new THREE.Mesh(panelGeo, mat);
      debugPanel.position.set(0.2, 0.02, 0);
      debugPanel.rotation.y = -Math.PI/2;
      debugPanel.visible = false;
      leftGrip.add(debugPanel);

      // Buttons arranged vertically: increase/decrease for each param
      const names = ['RPinch+', 'RPinch-', 'Pinch+', 'Pinch-', 'Throw+', 'Throw-', 'BackDot+', 'BackDot-'];
      const startY = 0.08; const gap = 0.035;
      names.forEach((n, i) => {
        const btnGeo = new THREE.PlaneGeometry(0.12, 0.03);
        const tex = makeButtonTexture(n);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        const btn = new THREE.Mesh(btnGeo, mat);
        btn.position.set(-0.07, startY - i * gap, 0.001);
        btn.userData.debugName = n;
        debugPanel.add(btn);
        debugButtons.push(btn);
      });
      return debugPanel;
    }

    function makeDebugTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(8,10,20,0.95)'; ctx.fillRect(0,0,512,512);
      ctx.fillStyle = '#9ee7ff'; ctx.font = '20px Arial'; ctx.textAlign = 'left';
      ctx.fillText('Debug Tuning', 20, 36);
      ctx.fillStyle = '#e2e8f0'; ctx.font = '18px Arial';
      ctx.fillText('Right pinch: ' + rightPinchThreshold.toFixed(3), 20, 80);
      ctx.fillText('Pinch: ' + pinchThreshold.toFixed(3), 20, 110);
      ctx.fillText('Throw scalar: ' + throwScalar.toFixed(2), 20, 140);
      ctx.fillText('Back dot thresh: ' + backFacingDotThreshold.toFixed(2), 20, 170);
      const tex = new THREE.CanvasTexture(canvas); tex.needsUpdate = true; return tex;
    }

    function refreshDebugPanelTexture() {
      if (!debugPanel) return;
      const mat = debugPanel.material;
      const oldTex = mat.map;
      mat.map = makeDebugTexture();
      mat.map.needsUpdate = true;
      if (oldTex) oldTex.dispose && oldTex.dispose();
    }

    function intersectDebugButtons(controller) {
      if (!debugButtons.length) return null;
      const origin = new THREE.Vector3(); controller.getWorldPosition(origin);
      const dir = new THREE.Vector3(0,0,-1).applyQuaternion(controller.quaternion).normalize();
      const ray = new THREE.Raycaster(origin, dir);
      const hits = ray.intersectObjects(debugButtons, false);
      return hits.length ? hits[0].object : null;
    }

    function makeButtonTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(15,23,42,0.95)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#22d3ee';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // --- Two-bone IK solver (approximate) ---
    function updateTwoBoneIK() {
      if (!rpmRoot) return;
      let debugText = 'IK: ';
      const sides = [ { prefix: 'left', wristNameCandidates: ['left_wrist','leftwrist','lefthand','left_hand'] , upper:'leftUpperArm', lower:'leftLowerArm', wrist:'leftWrist' },
                      { prefix: 'right', wristNameCandidates: ['right_wrist','rightwrist','righthand','right_hand'], upper:'rightUpperArm', lower:'rightLowerArm', wrist:'rightWrist' } ];
      const hands = pickHands(); // get WebXR hand data
      sides.forEach(side => {
        try {
          const upperBone = rpmBoneMap[side.upper];
          const lowerBone = rpmBoneMap[side.lower];
          const wristBone = rpmBoneMap[side.wrist];
          if (!upperBone || !lowerBone || !wristBone) { debugText += side.prefix + ': no bones '; return; }

          // prefer WebXR hand wrist position as target, fallback to relay
          let targetVec = null;
          const hand = side.prefix === 'left' ? hands.left : hands.right;
          if (hand) {
            const wristPos = getJointWorldPosition(hand, 'wrist');
            if (wristPos) targetVec = wristPos.clone();
          }
          if (!targetVec) {
            for (const n of side.wristNameCandidates) {
              if (lastJointPositions[n]) {
                targetVec = lastJointPositions[n].clone();
                break;
              }
            }
          }
          if (!targetVec) { debugText += side.prefix + ': no target '; return; }

          // world positions
          const shoulderPos = new THREE.Vector3(); upperBone.getWorldPosition(shoulderPos);
          const lowerPos = new THREE.Vector3(); lowerBone.getWorldPosition(lowerPos);
          const wristPos = new THREE.Vector3(); wristBone.getWorldPosition(wristPos);

          debugText += side.prefix + ': tgt=' + targetVec.toArray().map(x=>x.toFixed(2)).join(',') + ' sh=' + shoulderPos.toArray().map(x=>x.toFixed(2)).join(',') + ' ';

          // bone lengths
          const l1 = shoulderPos.distanceTo(lowerPos) || 0.25;
          const l2 = lowerPos.distanceTo(wristPos) || 0.25;

          // target vector
          const toTarget = targetVec.clone().sub(shoulderPos);
          const d = Math.max(0.0001, toTarget.length());
          // clamp reach
          const maxReach = l1 + l2 - 1e-4;
          const reach = Math.min(d, maxReach);

          // law of cosines to find angle at shoulder
          const cosAngle = THREE.MathUtils.clamp((l1*l1 + reach*reach - l2*l2) / (2*l1*reach), -1, 1);
          const shoulderAngle = Math.acos(cosAngle);

          // base direction
          const dir = toTarget.clone().normalize();
          // choose a bend axis (prefer world up)
          let bendAxis = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
          if (bendAxis.length() < 0.001) bendAxis = new THREE.Vector3(1,0,0);

          // compute two possible elbow positions
          const elbowPos1 = shoulderPos.clone().add(dir.clone().multiplyScalar(l1 * Math.cos(shoulderAngle))).add(bendAxis.clone().multiplyScalar(l1 * Math.sin(shoulderAngle)));
          const elbowPos2 = shoulderPos.clone().add(dir.clone().multiplyScalar(l1 * Math.cos(shoulderAngle))).add(bendAxis.clone().multiplyScalar(-l1 * Math.sin(shoulderAngle)));

          // choose the one farther from body center (rpmRoot.position)
          const bodyCenter = rpmRoot.position;
          const dist1 = elbowPos1.distanceTo(bodyCenter);
          const dist2 = elbowPos2.distanceTo(bodyCenter);
          const elbowPos = dist1 > dist2 ? elbowPos1 : elbowPos2;

          // compute desired world quaternions for upper and lower bones
          const upperDesired = new THREE.Quaternion();
          upperDesired.setFromUnitVectors(new THREE.Vector3(0,1,0), elbowPos.clone().sub(shoulderPos).normalize());
          const lowerDesired = new THREE.Quaternion();
          lowerDesired.setFromUnitVectors(new THREE.Vector3(0,1,0), targetVec.clone().sub(elbowPos).normalize());

          // convert to bone local space
          const upperParent = upperBone.parent || rpmRoot;
          const upperParentWorldQ = new THREE.Quaternion(); upperParent.getWorldQuaternion(upperParentWorldQ);
          const upperLocal = upperParentWorldQ.clone().invert().multiply(upperDesired);

          const lowerParent = lowerBone.parent || rpmRoot;
          const lowerParentWorldQ = new THREE.Quaternion(); lowerParent.getWorldQuaternion(lowerParentWorldQ);
          const lowerLocal = lowerParentWorldQ.clone().invert().multiply(lowerDesired);

          // slerp toward desired rotations with ikWeight
          upperBone.quaternion.slerp(upperLocal, ikWeight);
          lowerBone.quaternion.slerp(lowerLocal, ikWeight);
        } catch(e) { debugText += side.prefix + ': err '; }
      });
      updateDebug(debugText);
    }

    function intersectWatchButtons(controller) {
      const origin = new THREE.Vector3();
      controller.getWorldPosition(origin);
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion).normalize();
      const raycaster = new THREE.Raycaster(origin, dir);
      // Intersect against the button meshes
      const hits = raycaster.intersectObjects(watchButtons, false);
      return hits.length ? hits[0].object : null;
    }

    function loadRpmAvatar(url) {
  rpmRoot.clear();
  wristCorrection = {};
  avatarHandMeshes = [];
  headCorrection.active = false;
  headCorrection.quat.identity();
      const gltfLoader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
      gltfLoader.setDRACOLoader(draco);
      gltfLoader.load(url, (g) => {
        const model = g.scene;
        model.traverse(o => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            if (HIDE_AVATAR_HANDS_IN_VR) {
              const meshName = (o.name || '').toLowerCase();
              if (meshName.includes('hand')) {
                if (!o.userData) o.userData = {};
                if (o.userData.originalVisible === undefined) o.userData.originalVisible = o.visible;
                avatarHandMeshes.push(o);
              }
            }
          }
          if (o.isBone) {
            o.userData.initialQuat = o.quaternion.clone();
          }
    });
    // Place avatar near the mirror for desktop: slightly in front of the mirror plane
        const inVR = renderer.xr.isPresenting;
        if (!inVR) updateDesktopAvatarPose();
        rpmRoot.add(model);

        // Ensure rpmRoot is parented to scene so it stays in world space
        scene.add(rpmRoot);
        if (HIDE_AVATAR_HANDS_IN_VR && renderer.xr.isPresenting) {
          avatarHandMeshes.forEach(m => { if (m) m.visible = false; });
        }

        // Play animations if any
        if (g.animations && g.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const action = mixer.clipAction(g.animations[0]);
          action.play();
          console.log('Playing avatar animation:', g.animations[0].name);
        }

        // Try to detect bones for basic retargeting (wrist/hand bones)
        try {
          rpmBoneMap = {};
          model.traverse(o => {
            if (o.isSkinnedMesh && o.skeleton && o.skeleton.bones) {
              o.skeleton.bones.forEach(b => {
                const n = (b.name || '').toLowerCase();
                if (n.includes('left') && (n.includes('hand') || n.includes('wrist'))) rpmBoneMap.leftWrist = b;
                if (n.includes('right') && (n.includes('hand') || n.includes('wrist'))) rpmBoneMap.rightWrist = b;
                if (!rpmBoneMap.leftWrist && (n.startsWith('l') && (n.includes('hand') || n.includes('wrist')))) rpmBoneMap.leftWrist = b;
                if (!rpmBoneMap.rightWrist && (n.startsWith('r') && (n.includes('hand') || n.includes('wrist')))) rpmBoneMap.rightWrist = b;
                // try to detect arm bones
                if ((n.includes('left') || n.startsWith('l')) && (n.includes('upperarm') || n.includes('upper_arm') || n.includes('l_upperarm') || n.includes('leftarm') || n.includes('left_arm'))) rpmBoneMap.leftUpperArm = rpmBoneMap.leftUpperArm || b;
                if ((n.includes('left') || n.startsWith('l')) && (n.includes('lowerarm') || n.includes('forearm') || n.includes('lower_arm') || n.includes('leftforearm'))) rpmBoneMap.leftLowerArm = rpmBoneMap.leftLowerArm || b;
                if ((n.includes('right') || n.startsWith('r')) && (n.includes('upperarm') || n.includes('upper_arm') || n.includes('r_upperarm') || n.includes('rightarm') || n.includes('right_arm'))) rpmBoneMap.rightUpperArm = rpmBoneMap.rightUpperArm || b;
                if ((n.includes('right') || n.startsWith('r')) && (n.includes('lowerarm') || n.includes('forearm') || n.includes('lower_arm') || n.includes('rightforearm'))) rpmBoneMap.rightLowerArm = rpmBoneMap.rightLowerArm || b;
                if (!rpmBoneMap.head && n.includes('head')) rpmBoneMap.head = b;
                if (!rpmBoneMap.neck && n.includes('neck')) rpmBoneMap.neck = b;
              });
            }
          });
          if (rpmBoneMap.leftWrist || rpmBoneMap.rightWrist) console.log('Detected avatar bones for retargeting', rpmBoneMap);
        } catch (e) { console.warn('Failed to detect avatar bones', e); }

    recomputeAvatarHeadOffset();
    if (renderer.xr.isPresenting) updateAvatarInVR(0, true);

        // In VR, keep avatar in world space and follow the user's XZ with an offset so the camera
        // does not end up inside the head. We'll update rpmRoot in updateAvatarInVR to follow with offset.
        renderer.xr.addEventListener('sessionstart', () => {
          vrAnchorPos = null;
          vrAnchorYaw = null;
          headCorrection.active = false;
          headCorrection.quat.identity();
          wristCorrection = {};
          lastStableHands = { left: null, right: null };
          if (HIDE_AVATAR_HANDS_IN_VR) {
            avatarHandMeshes.forEach(m => { if (m) m.visible = false; });
          }
          recomputeAvatarHeadOffset();
          refreshHandHandedness();
          const rigWorldPos = _tmpRigWorldPos;
          if (camera.parent) camera.parent.getWorldPosition(rigWorldPos); else camera.getWorldPosition(rigWorldPos);
          scene.add(rpmRoot);
          updateAvatarInVR(0, true);
        });
        renderer.xr.addEventListener('sessionend', () => {
          vrAnchorPos = null;
          vrAnchorYaw = null;
          headCorrection.active = false;
          headCorrection.quat.identity();
          if (HIDE_AVATAR_HANDS_IN_VR) {
            avatarHandMeshes.forEach(m => {
              if (!m) return;
              const orig = m.userData && m.userData.originalVisible;
              m.visible = orig === undefined ? true : orig;
            });
          }
          wristCorrection = {};
          updateDesktopAvatarPose();
          scene.add(rpmRoot);
        });
      }, undefined, (e) => console.warn('Failed to load RPM avatar', e));
    }
