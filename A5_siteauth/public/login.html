<!doctype html>
<html>
  <head>
  <meta content="width=device-width, initial-scale=1, max-width=device-width, max-scale=1" name="viewport">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
   <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <style>
      body {
        font-family: 'Fjalla One', 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #header {
        color: #1e293b;
        font-size: 2.2em;
        margin-bottom: 50px;
        margin-top: 60px;
        letter-spacing: 1px;
        font-family: 'Fjalla One', Arial, sans-serif;
        text-align: center;
      }
      #loginRegisterWrapper {
        max-width: 450px;
        margin: 40px auto;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 6px 32px rgba(0,0,0,0.10);
        padding: 20px;
      }
      .tabs {
        background-color: transparent;
      }
      .tabs .tab a {
        color: #64748b;
        font-family: 'Fjalla One', Arial, sans-serif;
        font-size: 1.1em;
        letter-spacing: 0.5px;
      }
      .tabs .tab a:hover {
        color: #2563eb;
      }
      .tabs .tab a.active {
        color: #2563eb;
      }
      .tabs .indicator {
        background-color: #2563eb;
      }
      .btn {
        background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
        box-shadow: 0 2px 8px rgba(37,99,235,0.3);
        font-family: 'Fjalla One', Arial, sans-serif;
        letter-spacing: 0.5px;
        border-radius: 8px;
      }
      .btn:hover {
        background: linear-gradient(90deg, #1d4ed8 0%, #1e40af 100%);
        box-shadow: 0 4px 12px rgba(37,99,235,0.4);
      }
      input[type=email]:focus:not([readonly]),
      input[type=password]:focus:not([readonly]) {
        border-bottom: 1px solid #2563eb;
        box-shadow: 0 1px 0 0 #2563eb;
      }
      input[type=email]:focus:not([readonly]) + label,
      input[type=password]:focus:not([readonly]) + label {
        color: #2563eb;
      }
      input.valid[type=email]:not([readonly]),
      input.valid[type=password]:not([readonly]) {
        border-bottom: 1px solid #10b981;
        box-shadow: 0 1px 0 0 #10b981;
      }
      input.invalid[type=email]:not([readonly]),
      input.invalid[type=password]:not([readonly]) {
        border-bottom: 1px solid #ef4444;
        box-shadow: 0 1px 0 0 #ef4444;
      }
      .modal {
        border-radius: 12px;
      }
      .modal h4 {
        font-family: 'Fjalla One', Arial, sans-serif;
        color: #1e293b;
      }
      .modal-footer .btn-flat {
        color: #2563eb;
        font-family: 'Fjalla One', Arial, sans-serif;
      }
      label {
        font-family: 'Fjalla One', Arial, sans-serif;
        font-size: 0.95em;
      }
    </style>
    <script>
      
      var start = function(){
        $('.modal').modal();
        $("#passwordR").on("keyup focusout", function (e) {
          if ($(this).val().length < 5) {
            $(this).removeClass("valid").addClass("invalid");
            $("#registerButton").fadeOut();
          } else {
            $(this).removeClass("invalid").addClass("valid");
            $("#registerButton").fadeIn();
          }
        });

        $("#loginRegisterWrapper").fadeIn();
        M.Tabs.init(document.getElementById("loginTabs"), {});
        var hash = window.location.hash.replace("#","")
        var eid = hash.split(",")[1] || "";
        var fail = hash.split(",")[0] || "";
        if(fail == "fail"){
          $("#password").addClass("invalid");
          if (eid != ""){
            $("#email").val(eid);
            $("#email").addClass("invalid");
          }
        }
        if(fail === "failReg"){
          var instance = M.Tabs.getInstance(document.getElementById("loginTabs"));
          instance.select("registerSection");
          instance = M.Modal.getInstance(document.getElementById("failReg"));
          instance.open();
        }
        $("#registerButton").fadeOut();
      }
    </script>
  </head>
    <body onload='start()'>
    <h1 id='header' style='margin-bottom:50px;text-align:center'>
        Mark Jordan's Fancy login/register page
    </h1>
        

    <div style='margin:auto; max-width:400px;display:none' id='loginRegisterWrapper' class='container card'>
      <div class="col s12">
       <ul class="tabs" id='loginTabs' style='text-align:center'>
        <li class="tab col s3"><a class="active" href="#loginSection">Login</a></li>
        <li class="tab col s3"><a href="#registerSection">Register</a></li>
       </ul>
      </div>
      <div id='loginSection' style='padding-bottom:10px;'>
       <form name='login' action="/tryLogin" method="post">
        <div class="row">
              <div class="input-field col s12">
                <input id="email" type="email" class="validate" name='email'>
                <label for="email">Email</label>
                <span class="helper-text" data-error="wrong" data-success="right"></span>
              </div>
        </div>
        <div class="row">
              <div class="input-field col s12">
                <input id="password" type="password" name='password'  class="validate">
                <label for="password" class="">Password</label>
                <span class="helper-text" data-error="wrong" data-success="right"></span>
              </div>
         </div>
          <button type='submit' class="btn waves-effect waves-light"  name="action" style='margin:auto;display: block;margin-bottom:30px'>Login
              <i class="material-icons right">arrow_forward</i>
          </button>
        </form>
      </div>
      <div id='registerSection' style='padding-bottom:10px;'>
       <form name='register' action="/tryRegister" method="post">
        <div class="row">
              <div class="input-field col s12">
                <input id="emailR" type="email" name='emailR'  class="validate">
                <label for="emailR">Email</label>
                <span class="helper-text" data-error="wrong" data-success="right"></span>
              </div>
         </div>
        <div class="row">
              <div class="input-field col s12">
                <input id="passwordR" type="password" name='passwordR' class="validate" data-length="10">
                <label for="passwordR" class="">Password</label>
                <span class="helper-text" data-error="Password needs to be atleast 5 charecters" data-success="Valid Password"></span>
              </div>
         </div>
          <button id='registerButton' class="btn waves-effect waves-light" type='submit'  style='margin:auto;display:block;margin-bottom:30px'>Register
              <i class="material-icons left">assignment_ind</i>
          </button>
        </form>
      </div>
    </div>
    
      <!-- Modal Structure -->
  <div id="failReg" class="modal">
    <div class="modal-content">
      <h4>Registration failed</h4>
      <p>Please try again in a few minutes</p>
    </div>
    <div class="modal-footer">
      <a href="#!" class="modal-close waves-effect waves-green btn-flat">OK</a>
    </div>
  </div>
    <div style="text-align:center; padding:20px; color:#888; font-size:0.9em; font-family: 'Fjalla One', Arial, sans-serif;">
      Powered by Express.js HTTPS Server with Authentication
    </div>
    </body>
            
</html>
