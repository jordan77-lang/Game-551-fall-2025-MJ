<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Social Platform - Hand Tracking Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        #enterVR {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
        }
        #enterVR:hover {
            background: linear-gradient(90deg, #1d4ed8 0%, #1e40af 100%);
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>VR Hand Tracking Test</h3>
        <p>🎮 Use Quest headset to test</p>
        <p>✋ Hand tracking will show your hands in VR</p>
        <p id="status">Status: Loading...</p>
        <p>
            <a href="landing.html" style="color: #22d3ee; text-decoration: underline; margin-right: 10px;">Go to Landing/Rooms →</a>
            <a href="multiplayer.html" style="color: #4ade80; text-decoration: underline;">Try Multiplayer (direct) →</a>
        </p>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        // Scene setup
        let scene, camera, renderer;
        let hand1, hand2;
        let handModels = {};

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Add VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Floor grid
            const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
            scene.add(gridHelper);

            // Add some reference cubes
            addReferenceCubes();

            // Hand tracking setup
            setupHandTracking();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Start animation
            renderer.setAnimationLoop(animate);

            document.getElementById('status').textContent = 'Status: Ready! Click "Enter VR" button below';
        }

        function setupHandTracking() {
            const handModelFactory = new XRHandModelFactory();

            // Hand 1 (left)
            hand1 = renderer.xr.getHand(0);
            hand1.add(handModelFactory.createHandModel(hand1, 'mesh'));
            scene.add(hand1);

            // Hand 2 (right)
            hand2 = renderer.xr.getHand(1);
            hand2.add(handModelFactory.createHandModel(hand2, 'mesh'));
            scene.add(hand2);

            console.log('Hand tracking initialized');
        }

        function addReferenceCubes() {
            // Add some cubes to interact with
            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
            
            for (let i = 0; i < 5; i++) {
                const material = new THREE.MeshStandardMaterial({ color: colors[i] });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set((i - 2) * 0.5, 1.5, -2);
                scene.add(cube);
            }

            // Add a floor plane
            const planeGeometry = new THREE.PlaneGeometry(20, 20);
            const planeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x808080,
                roughness: 0.8
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.render(scene, camera);
        }

        // Initialize when page loads
        init();
    </script>
</body>
</html>
