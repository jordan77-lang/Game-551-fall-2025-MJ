<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Social Platform - Multiplayer Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }
        #userCount {
            color: #4ade80;
            font-weight: bold;
        }
        #roomInput {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        #roomInput input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #2563eb;
            margin-right: 5px;
        }
        #roomInput button {
            padding: 8px 15px;
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>VR Multiplayer Test</h3>
        <p>🎮 Users online: <span id="userCount">0</span></p>
        <p>📍 Room: <span id="currentRoom">lobby</span></p>
        <p id="status">Status: Connecting...</p>
        <p style="font-size: 12px; color: #888;">Move with WASD keys (desktop) or walk in VR</p>
    </div>

    <div id="roomInput">
        <button id="backToLobby" style="display:none; margin-bottom:8px; padding:8px 15px; background: linear-gradient(90deg, #10b981, #059669); color:white; border:none; border-radius:4px; cursor:pointer;">Back to Lobby</button>
        <input type="text" id="roomName" placeholder="Enter room name" value="lobby">
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { createAvatar, createOrUpdateHands } from './js/avatar.js';

        // Scene setup
        let scene, camera, renderer;
        let hand1, hand2;
        let socket;
    // Read URL params
    const params = new URLSearchParams(window.location.search);
    let currentRoom = params.get('room') || 'lobby';
    const sceneUrl = params.get('scene');
    const myName = params.get('name') || 'Guest';
    const myColor = params.get('color') || '#44cc66';
    const myStyle = params.get('style') || 'capsule';
    const myAvatarUrl = params.get('avatarUrl') || localStorage.getItem('vr_rpm_avatar') || '';
    document.getElementById('roomName').value = currentRoom;
    document.getElementById('currentRoom').textContent = currentRoom;
    
    // Show "Back to Lobby" button if not already in cube-room
    if (currentRoom !== 'cube-room') {
        document.getElementById('backToLobby').style.display = 'block';
    }
    document.getElementById('backToLobby').onclick = () => {
        const lobbyUrl = new URL(window.location.href);
        lobbyUrl.searchParams.set('room', 'cube-room');
        lobbyUrl.searchParams.set('scene', 'Rooms/cube-room/cube-room.gltf');
        window.location.href = lobbyUrl.toString();
    };
        let myId = null;
    let otherUsers = {}; // Store other users' avatars (THREE.Group)
    let lastHandsSent = 0;

        // Movement
        let moveSpeed = 0.1;
        let keys = {};

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Add VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            if (sceneUrl) {
                // Load GLTF scene
                const loader = new GLTFLoader();
                loader.load(sceneUrl, (gltf) => {
                    const env = gltf.scene;
                    env.traverse((c)=>{ if (c.isMesh){ c.castShadow = true; c.receiveShadow = true; }});
                        scene.add(env);
                        // Compute room bounds from loaded environment if possible
                        try {
                            const box = new THREE.Box3().setFromObject(env);
                            if (!box.isEmpty()) {
                                // store on scene for other code to read
                                scene.userData.roomBounds = { min: box.min.clone(), max: box.max.clone() };
                                console.log('Multiplayer scene bounds:', scene.userData.roomBounds);
                            }
                        } catch(e){ console.warn('Failed to compute multiplayer scene bounds', e); }
                }, undefined, (e)=>{
                    console.warn('Failed to load scene, falling back to default plane.', e);
                    addDefaultEnvironment();
                });
            } else {
                addDefaultEnvironment();
            }

            // Hand tracking setup
            setupHandTracking();

            // Socket.io setup
            setupSocket();

            // Keyboard controls
            setupKeyboardControls();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Start animation
            renderer.setAnimationLoop(animate);

            document.getElementById('status').textContent = 'Status: Ready!';
        }

        function setupSocket() {
            socket = io();

            socket.on('connect', () => {
                myId = socket.id;
                console.log('Connected with ID:', myId);
                document.getElementById('status').textContent = 'Status: Connected!';
                
                // Join room with user metadata
                socket.emit('joinRoom', currentRoom, { name: myName, color: myColor, style: myStyle, avatarUrl: myAvatarUrl });
            });

            socket.on('userJoined', (data) => {
                console.log('User joined:', data.userId);
                createOtherUserAvatar(data.userId, data.user || null);
                updateUserCount();
            });

            socket.on('userMoved', (data) => {
                if (otherUsers[data.userId]) {
                    otherUsers[data.userId].position.copy(data.position);
                    if (data.rotation) {
                        otherUsers[data.userId].rotation.copy(data.rotation);
                    }
                }
            });

            socket.on('handsUpdated', (data) => {
                const group = otherUsers[data.userId];
                if (!group) return;
                // Use the user's color if known; otherwise default white
                const color = (group.userData && group.userData.color) || '#ffffff';
                createOrUpdateHands(group, color, data.leftHand, data.rightHand);
            });

            socket.on('userLeft', (userId) => {
                console.log('User left:', userId);
                if (otherUsers[userId]) {
                    scene.remove(otherUsers[userId]);
                    delete otherUsers[userId];
                    updateUserCount();
                }
            });

            socket.on('disconnect', () => {
                document.getElementById('status').textContent = 'Status: Disconnected';
            });
        }

        function createOtherUserAvatar(userId, user) {
            const meta = user || {};
            const fallback = () => {
                const avatar = createAvatar({
                    style: meta.style || 'capsule',
                    color: meta.color || '#8b5cf6',
                    name: meta.name || `User ${userId.substring(0,6)}`
                });
                avatar.userData.color = meta.color || '#8b5cf6';
                avatar.position.set(Math.random() * 4 - 2, 0, Math.random() * 4 - 2);
                scene.add(avatar);
                otherUsers[userId] = avatar;
            };

            if (meta.avatarUrl) {
                const draco = new DRACOLoader();
                draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
                const loader = new GLTFLoader();
                loader.setDRACOLoader(draco);
                loader.load(meta.avatarUrl, (gltf) => {
                    const root = new THREE.Group();
                    const model = gltf.scene;
                    model.scale.setScalar(1);
                    root.add(model);
                    root.position.set(Math.random() * 4 - 2, 0, Math.random() * 4 - 2);
                    root.userData.color = meta.color || '#8b5cf6';
                    scene.add(root);
                    otherUsers[userId] = root;
                }, undefined, (err) => {
                    console.warn('Failed to load RPM avatar, using fallback.', err);
                    fallback();
                });
            } else {
                fallback();
            }
        }

        function addDefaultEnvironment(){
            const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
            scene.add(gridHelper);

            const planeGeometry = new THREE.PlaneGeometry(20, 20);
            const planeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x808080,
                roughness: 0.8
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);

            addReferenceCubes();
        }

        function updateUserCount() {
            const count = Object.keys(otherUsers).length;
            document.getElementById('userCount').textContent = count;
        }

        function setupHandTracking() {
            const handModelFactory = new XRHandModelFactory();

            hand1 = renderer.xr.getHand(0);
            hand1.add(handModelFactory.createHandModel(hand1, 'mesh'));
            scene.add(hand1);

            hand2 = renderer.xr.getHand(1);
            hand2.add(handModelFactory.createHandModel(hand2, 'mesh'));
            scene.add(hand2);
        }

        function addReferenceCubes() {
            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
            
            for (let i = 0; i < 5; i++) {
                const material = new THREE.MeshStandardMaterial({ color: colors[i] });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set((i - 2) * 0.5, 1.5, -2);
                scene.add(cube);
            }
        }

        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
        }

        function updateMovement() {
            // WASD movement
            if (keys['w']) camera.position.z -= moveSpeed;
            if (keys['s']) camera.position.z += moveSpeed;
            if (keys['a']) camera.position.x -= moveSpeed;
            if (keys['d']) camera.position.x += moveSpeed;

            // Send position update
            if (socket && myId && (keys['w'] || keys['s'] || keys['a'] || keys['d'])) {
                socket.emit('updatePosition', {
                    roomId: currentRoom,
                    position: camera.position,
                    rotation: camera.rotation
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            updateMovement();

            // Throttled hand updates in VR sessions
            const now = performance.now();
            if (renderer.xr.isPresenting && socket && myId && (now - lastHandsSent) > 100) {
                lastHandsSent = now;
                const left = extractPose(hand1);
                const right = extractPose(hand2);
                socket.emit('updateHands', { roomId: currentRoom, leftHand: left, rightHand: right });
            }

            renderer.render(scene, camera);
        }

        function extractPose(object3D){
            if (!object3D) return null;
            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();
            object3D.getWorldPosition(pos);
            object3D.getWorldQuaternion(quat);
            return { position: { x: pos.x, y: pos.y, z: pos.z }, quaternion: { x: quat.x, y: quat.y, z: quat.z, w: quat.w } };
        }

        // Global function for room joining
        window.joinRoom = function() {
            const roomName = document.getElementById('roomName').value || 'lobby';
            currentRoom = roomName;
            document.getElementById('currentRoom').textContent = roomName;
            
            // Clear existing users
            for (let userId in otherUsers) {
                scene.remove(otherUsers[userId]);
            }
            otherUsers = {};
            
            // Join new room
            socket.emit('joinRoom', roomName, { name: myName, color: myColor, style: myStyle });
        }

        // Initialize when page loads
        init();
    </script>
</body>
</html>
