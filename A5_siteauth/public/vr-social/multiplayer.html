<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Social Platform - Multiplayer Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }
        #userCount {
            color: #4ade80;
            font-weight: bold;
        }
        #roomInput {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        #roomInput input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #2563eb;
            margin-right: 5px;
        }
        #roomInput button {
            padding: 8px 15px;
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>VR Multiplayer Test</h3>
        <p>🎮 Users online: <span id="userCount">0</span></p>
        <p>📍 Room: <span id="currentRoom">lobby</span></p>
        <p id="status">Status: Connecting...</p>
        <p style="font-size: 12px; color: #888;">Move with WASD keys (desktop) or walk in VR</p>
    </div>

    <div id="roomInput">
        <button id="backToLobby" style="display:none; margin-bottom:8px; padding:8px 15px; background: linear-gradient(90deg, #10b981, #059669); color:white; border:none; border-radius:4px; cursor:pointer;">Back to Lobby</button>
        <input type="text" id="roomName" placeholder="Enter room name" value="lobby">
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { createAvatar, createOrUpdateHands } from './js/avatar.js';

        // Scene setup
        let scene, camera, renderer;
        let hand1, hand2;
        let socket;
        const clock = new THREE.Clock();
        let handMenu = null;
        const handMenuButtons = [];
        const handMenuState = { visible: true };
        const MENU_TOUCH_THRESHOLD = 0.025;
        const PINCH_ACTIVATE_THRESHOLD = 0.022;
        const MENU_PRESS_COOLDOWN = 0.35;
        const WATCH_LOOK_THRESHOLD = 0.45;
        let handMenuCooldown = 0;
        let floorGrid = null;
        const QUICK_ROOM_SHORTCUTS = [
            { id: 'room-cube', label: 'Cube', room: 'cube-room', scene: 'Rooms/cube-room/cube-room.gltf' },
            { id: 'room-camp', label: 'Camp', room: 'camp', scene: 'Rooms/camp/camp.gltf' },
            { id: 'room-cave', label: 'Cave', room: 'cave', scene: 'Rooms/cave/cave.gltf' }
        ];
        const tempVecHandA = new THREE.Vector3();
        const tempVecHandB = new THREE.Vector3();
        const tempVecHandC = new THREE.Vector3();
        const tempVecHandD = new THREE.Vector3();
        const tempVecHandE = new THREE.Vector3();
        const tempVecHandF = new THREE.Vector3();
        const tempVecHandG = new THREE.Vector3();
        const tempQuaternionHand = new THREE.Quaternion();
    // Read URL params
    const params = new URLSearchParams(window.location.search);
    let currentRoom = params.get('room') || 'lobby';
    const sceneUrl = params.get('scene');
    const myName = params.get('name') || 'Guest';
    const myColor = params.get('color') || '#44cc66';
    const myStyle = params.get('style') || 'capsule';
    const myAvatarUrl = params.get('avatarUrl') || localStorage.getItem('vr_rpm_avatar') || '';
    document.getElementById('roomName').value = currentRoom;
    document.getElementById('currentRoom').textContent = currentRoom;
    
    // Show "Back to Lobby" button if not already in cube-room
    if (currentRoom !== 'cube-room') {
        document.getElementById('backToLobby').style.display = 'block';
    }
    document.getElementById('backToLobby').onclick = () => {
        const lobbyUrl = new URL(window.location.href);
        lobbyUrl.searchParams.set('room', 'cube-room');
        lobbyUrl.searchParams.set('scene', 'Rooms/cube-room/cube-room.gltf');
        window.location.href = lobbyUrl.toString();
    };
        let myId = null;
    let otherUsers = {}; // Store other users' avatars (THREE.Group)
    let lastHandsSent = 0;

        // Movement
        let moveSpeed = 0.1;
        let keys = {};

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Add VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            if (sceneUrl) {
                // Load GLTF scene
                const loader = new GLTFLoader();
                loader.load(sceneUrl, (gltf) => {
                    const env = gltf.scene;
                    env.traverse((c)=>{ if (c.isMesh){ c.castShadow = true; c.receiveShadow = true; }});
                        scene.add(env);
                        // Compute room bounds from loaded environment if possible
                        try {
                            const box = new THREE.Box3().setFromObject(env);
                            if (!box.isEmpty()) {
                                // store on scene for other code to read
                                scene.userData.roomBounds = { min: box.min.clone(), max: box.max.clone() };
                                console.log('Multiplayer scene bounds:', scene.userData.roomBounds);
                            }
                        } catch(e){ console.warn('Failed to compute multiplayer scene bounds', e); }
                }, undefined, (e)=>{
                    console.warn('Failed to load scene, falling back to default plane.', e);
                    addDefaultEnvironment();
                });
            } else {
                addDefaultEnvironment();
            }

            // Hand tracking setup
            setupHandTracking();

            // Socket.io setup
            setupSocket();

            // Keyboard controls
            setupKeyboardControls();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Start animation
            renderer.setAnimationLoop(animate);

            document.getElementById('status').textContent = 'Status: Ready!';
        }

        function setupSocket() {
            const statusEl = document.getElementById('status');
            if (typeof window === 'undefined' || typeof window.io !== 'function') {
                console.warn('Socket.io client bundle not found; running in offline mode.');
                if (statusEl) statusEl.textContent = 'Status: Offline (no realtime server)';
                return;
            }

            socket = window.io();

            socket.on('connect', () => {
                myId = socket.id;
                console.log('Connected with ID:', myId);
                if (statusEl) statusEl.textContent = 'Status: Connected!';
                
                // Join room with user metadata
                socket.emit('joinRoom', currentRoom, { name: myName, color: myColor, style: myStyle, avatarUrl: myAvatarUrl });
            });

            socket.on('userJoined', (data) => {
                console.log('User joined:', data.userId);
                createOtherUserAvatar(data.userId, data.user || null);
                updateUserCount();
            });

            socket.on('userMoved', (data) => {
                if (otherUsers[data.userId]) {
                    otherUsers[data.userId].position.copy(data.position);
                    if (data.rotation) {
                        otherUsers[data.userId].rotation.copy(data.rotation);
                    }
                }
            });

            socket.on('handsUpdated', (data) => {
                const group = otherUsers[data.userId];
                if (!group) return;
                // Use the user's color if known; otherwise default white
                const color = (group.userData && group.userData.color) || '#ffffff';
                createOrUpdateHands(group, color, data.leftHand, data.rightHand);
            });

            socket.on('userLeft', (userId) => {
                console.log('User left:', userId);
                if (otherUsers[userId]) {
                    scene.remove(otherUsers[userId]);
                    delete otherUsers[userId];
                    updateUserCount();
                }
            });

            socket.on('disconnect', () => {
                if (statusEl) statusEl.textContent = 'Status: Disconnected';
            });
        }

        function createOtherUserAvatar(userId, user) {
            const meta = user || {};
            const fallback = () => {
                const avatar = createAvatar({
                    style: meta.style || 'capsule',
                    color: meta.color || '#8b5cf6',
                    name: meta.name || `User ${userId.substring(0,6)}`
                });
                avatar.userData.color = meta.color || '#8b5cf6';
                avatar.position.set(Math.random() * 4 - 2, 0, Math.random() * 4 - 2);
                scene.add(avatar);
                otherUsers[userId] = avatar;
            };

            if (meta.avatarUrl) {
                const draco = new DRACOLoader();
                draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
                const loader = new GLTFLoader();
                loader.setDRACOLoader(draco);
                loader.load(meta.avatarUrl, (gltf) => {
                    const root = new THREE.Group();
                    const model = gltf.scene;
                    model.scale.setScalar(1);
                    root.add(model);
                    root.position.set(Math.random() * 4 - 2, 0, Math.random() * 4 - 2);
                    root.userData.color = meta.color || '#8b5cf6';
                    scene.add(root);
                    otherUsers[userId] = root;
                }, undefined, (err) => {
                    console.warn('Failed to load RPM avatar, using fallback.', err);
                    fallback();
                });
            } else {
                fallback();
            }
        }

        function addDefaultEnvironment(){
            const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
            floorGrid = gridHelper;
            scene.add(gridHelper);
            updateGridButtonLabel();

            const planeGeometry = new THREE.PlaneGeometry(20, 20);
            const planeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x808080,
                roughness: 0.8
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);

            addReferenceCubes();
        }

        function updateUserCount() {
            const count = Object.keys(otherUsers).length;
            document.getElementById('userCount').textContent = count;
        }

        function setupHandTracking() {
            const handModelFactory = new XRHandModelFactory();

            hand1 = renderer.xr.getHand(0);
            hand1.add(handModelFactory.createHandModel(hand1, 'mesh'));
            scene.add(hand1);

            hand2 = renderer.xr.getHand(1);
            hand2.add(handModelFactory.createHandModel(hand2, 'mesh'));
            scene.add(hand2);
            initHandMenu();
        }

        function addReferenceCubes() {
            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
            
            for (let i = 0; i < 5; i++) {
                const material = new THREE.MeshStandardMaterial({ color: colors[i] });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set((i - 2) * 0.5, 1.5, -2);
                scene.add(cube);
            }
        }

        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                keys[key] = true;
                if (key === 'm') {
                    handMenuState.visible = !handMenuState.visible;
                    if (handMenu) handMenu.visible = handMenuState.visible;
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
        }

        function updateMovement() {
            // WASD movement
            if (keys['w']) camera.position.z -= moveSpeed;
            if (keys['s']) camera.position.z += moveSpeed;
            if (keys['a']) camera.position.x -= moveSpeed;
            if (keys['d']) camera.position.x += moveSpeed;

            // Send position update
            if (socket && myId && (keys['w'] || keys['s'] || keys['a'] || keys['d'])) {
                socket.emit('updatePosition', {
                    roomId: currentRoom,
                    position: camera.position,
                    rotation: camera.rotation
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const delta = clock.getDelta();
            updateMovement();
            updateHandMenu(delta);

            // Throttled hand updates in VR sessions
            const now = performance.now();
            if (renderer.xr.isPresenting && socket && myId && (now - lastHandsSent) > 100) {
                lastHandsSent = now;
                const left = extractPose(hand1);
                const right = extractPose(hand2);
                socket.emit('updateHands', { roomId: currentRoom, leftHand: left, rightHand: right });
            }

            renderer.render(scene, camera);
        }

        function extractPose(object3D){
            if (!object3D) return null;
            const pos = new THREE.Vector3();
            const quat = new THREE.Quaternion();
            object3D.getWorldPosition(pos);
            object3D.getWorldQuaternion(quat);
            return { position: { x: pos.x, y: pos.y, z: pos.z }, quaternion: { x: quat.x, y: quat.y, z: quat.z, w: quat.w } };
        }

        function initHandMenu() {
            if (!hand1 || handMenu) return;
            handMenu = new THREE.Group();
            handMenu.name = 'BackOfHandMenu';
            handMenu.position.set(0.045, 0.03, -0.03);
            handMenu.rotation.set(-Math.PI / 2, 0, 0);

            const panel = new THREE.Mesh(
                new THREE.PlaneGeometry(0.14, 0.2),
                new THREE.MeshBasicMaterial({ color: 0x0f172a, transparent: true, opacity: 0.82, side: THREE.DoubleSide })
            );
            panel.position.z = -0.002;
            handMenu.add(panel);

            const defs = [
                { id: 'respawn', label: 'Respawn' },
                { id: 'toggle-grid', label: 'Grid OFF' },
                { id: 'go-lobby', label: 'Lobby' },
                { id: 'go-landing', label: 'Landing' },
                ...QUICK_ROOM_SHORTCUTS
            ];

            const startY = 0.11;
            const spacing = 0.05;
            defs.forEach((def, idx) => {
                const btn = createHandMenuButton(def.label);
                btn.position.set(0, startY - idx * spacing, 0.001);
                btn.userData.actionId = def.id;
                handMenu.add(btn);
                handMenuButtons.push({ mesh: btn, def, hovered: false });
            });

            hand1.add(handMenu);
            updateGridButtonLabel();
        }

        function createHandMenuButton(label, width = 0.11, height = 0.04) {
            const geometry = new THREE.PlaneGeometry(width, height);
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const texture = new THREE.CanvasTexture(canvas);
            if (texture.colorSpace !== undefined) {
                texture.colorSpace = THREE.SRGBColorSpace;
            } else {
                texture.encoding = THREE.sRGBEncoding;
            }
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, color: 0xffffff });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.userData.canvas = canvas;
            redrawButtonCanvas(mesh, label);
            return mesh;
        }

        function redrawButtonCanvas(mesh, label) {
            const canvas = mesh.userData.canvas;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(15,23,42,0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, canvas.width / 2, canvas.height / 2);
            mesh.material.map.needsUpdate = true;
        }

        function updateHandMenu(delta) {
            if (!handMenu) return;
            if (handMenuCooldown > 0) handMenuCooldown -= delta;

            const inVR = renderer && renderer.xr && renderer.xr.isPresenting;
            const watchPoseActive = shouldDisplayHandMenu();
            const visibleNow = inVR && handMenuState.visible && watchPoseActive;
            handMenu.visible = visibleNow;
            if (!visibleNow) {
                handMenuButtons.forEach((entry) => {
                    entry.mesh.material.color.set(0xffffff);
                    entry.mesh.scale.setScalar(1);
                    entry.hovered = false;
                });
                return;
            }

            let hoveredEntry = null;
            const tip = hand2 && hand2.joints ? hand2.joints['index-finger-tip'] : null;
            const thumb = hand2 && hand2.joints ? hand2.joints['thumb-tip'] : null;
            if (!(tip && thumb)) {
                handMenuButtons.forEach((entry) => {
                    entry.mesh.material.color.set(0xffffff);
                    entry.mesh.scale.setScalar(1);
                });
                return;
            }

            tip.getWorldPosition(tempVecHandA);
            thumb.getWorldPosition(tempVecHandB);
            const pinching = tempVecHandA.distanceTo(tempVecHandB) < PINCH_ACTIVATE_THRESHOLD;

            handMenuButtons.forEach((entry) => {
                entry.mesh.getWorldPosition(tempVecHandC);
                const hovered = tempVecHandA.distanceTo(tempVecHandC) < MENU_TOUCH_THRESHOLD;
                entry.hovered = hovered;
                entry.mesh.material.color.set(hovered ? 0x22d3ee : 0xffffff);
                entry.mesh.scale.setScalar(hovered ? 1.05 : 1);
                if (hovered) hoveredEntry = entry;
            });

            if (hoveredEntry && pinching && handMenuCooldown <= 0) {
                handMenuCooldown = MENU_PRESS_COOLDOWN;
                triggerHandMenuAction(hoveredEntry.def.id);
            }
        }

        function shouldDisplayHandMenu() {
            if (!handMenu) return false;
            if (!(renderer && renderer.xr && renderer.xr.isPresenting)) return false;
            handMenu.getWorldQuaternion(tempQuaternionHand);
            const menuNormal = tempVecHandD.set(0, 0, 1).applyQuaternion(tempQuaternionHand).normalize();
            handMenu.getWorldPosition(tempVecHandE);
            camera.getWorldPosition(tempVecHandF);
            const toCamera = tempVecHandF.sub(tempVecHandE).normalize();
            return menuNormal.dot(toCamera) > WATCH_LOOK_THRESHOLD;
        }

        function triggerHandMenuAction(actionId) {
            switch (actionId) {
                case 'respawn':
                    respawnPlayer();
                    break;
                case 'toggle-grid':
                    toggleGridHelperVisibility();
                    break;
                case 'go-lobby':
                    goToLobbyFromMenu();
                    break;
                case 'go-landing':
                    goToLandingFromMenu();
                    break;
                default:
                    if (actionId && actionId.startsWith('room-')) {
                        goToQuickRoom(actionId);
                    }
                    break;
            }
        }

        function respawnPlayer() {
            const bounds = scene && scene.userData && scene.userData.roomBounds;
            if (bounds) {
                const cx = (bounds.min.x + bounds.max.x) * 0.5;
                const cz = (bounds.min.z + bounds.max.z) * 0.5;
                const minY = bounds.min.y || 0;
                camera.position.set(cx, Math.max(1.6, minY + 1.6), cz);
            } else {
                camera.position.set(0, 1.6, 3);
            }
            camera.rotation.set(0, 0, 0);
        }

        function toggleGridHelperVisibility() {
            if (!floorGrid) {
                floorGrid = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
                scene.add(floorGrid);
            }
            floorGrid.visible = !floorGrid.visible;
            updateGridButtonLabel();
        }

        function updateGridButtonLabel() {
            const label = floorGrid && floorGrid.visible ? 'Grid ON' : 'Grid OFF';
            updateHandMenuButtonLabel('toggle-grid', label);
        }

        function updateHandMenuButtonLabel(actionId, text) {
            const entry = handMenuButtons.find((btn) => btn.def.id === actionId);
            if (!entry) return;
            redrawButtonCanvas(entry.mesh, text);
        }

        function goToLobbyFromMenu() {
            navigateToRoom('cube-room', 'Rooms/cube-room/cube-room.gltf');
        }

        function goToLandingFromMenu() {
            window.location.href = 'landing.html';
        }

        function goToQuickRoom(actionId) {
            const shortcut = QUICK_ROOM_SHORTCUTS.find((entry) => entry.id === actionId);
            if (!shortcut) return;
            navigateToRoom(shortcut.room, shortcut.scene);
        }

        function navigateToRoom(roomId, scenePath) {
            const target = new URL(window.location.href);
            target.searchParams.set('room', roomId);
            if (scenePath) target.searchParams.set('scene', scenePath);
            window.location.href = target.toString();
        }

        // Global function for room joining
        window.joinRoom = function() {
            const roomName = document.getElementById('roomName').value || 'lobby';
            currentRoom = roomName;
            document.getElementById('currentRoom').textContent = roomName;
            
            // Clear existing users
            for (let userId in otherUsers) {
                scene.remove(otherUsers[userId]);
            }
            otherUsers = {};
            
            // Join new room if realtime server is available
            if (socket) {
                socket.emit('joinRoom', roomName, { name: myName, color: myColor, style: myStyle });
            } else {
                console.warn('Realtime server unavailable; staying in offline mode.');
            }
        }

        // Initialize when page loads
        init();
    </script>
</body>
</html>
